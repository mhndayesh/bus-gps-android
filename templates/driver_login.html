<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <title>آمن مدرستي - دخول السائق</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sage-green: #9FB8AD;
            --sage-dark: #7A9A8D;
            --gold: #F5C518;
            --gold-dark: #D4A914;
            --black: #1A1A1A;
            --cream: #F5F5F0;
            --white: #FFFFFF;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--black) 0%, #2d2d2d 100%);
            margin: 0;
        }

        .login-box {
            background: var(--cream);
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.4);
            width: 340px;
            border: 3px solid var(--gold);
        }

        .logo-section {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-section .icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .logo-section h1 {
            margin: 0;
            font-size: 1.5em;
            color: var(--black);
        }

        .logo-section .subtitle {
            color: var(--sage-dark);
            margin: 5px 0 0 0;
            font-size: 0.9em;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: 2px solid var(--sage-green);
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 1em;
            font-family: 'Tajawal', sans-serif;
            transition: border-color 0.3s ease;
            text-align: right;
        }

        input:focus {
            outline: none;
            border-color: var(--gold);
        }

        input::placeholder {
            color: var(--sage-dark);
        }

        button {
            width: 100%;
            padding: 14px;
            background: var(--black);
            color: var(--gold);
            border: 2px solid var(--gold);
            border-radius: 12px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: bold;
            font-family: 'Tajawal', sans-serif;
            transition: all 0.3s ease;
        }

        button:hover {
            background: var(--gold);
            color: var(--black);
            transform: translateY(-2px);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--sage-dark);
            text-decoration: none;
            font-size: 0.9em;
        }

        .back-link:hover {
            color: var(--black);
        }

        .bilingual-label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9em;
            color: var(--black);
        }

        .welcome-text {
            text-align: center;
            color: var(--sage-dark);
            font-size: 0.9em;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <div class="login-box">
        <div class="logo-section">
            <div class="icon">🚌</div>
            <h1>بوابة السائقين</h1>
            <p class="subtitle">Driver Portal</p>
        </div>

        <p class="welcome-text">مرحباً بك في نظام تتبع الحافلات</p>

        <form method="POST" action="/driver/login">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label class="bilingual-label">اسم المستخدم / Username</label>
            <input type="text" name="username" placeholder="أدخل اسم المستخدم" required>

            <label class="bilingual-label">كلمة المرور / Password</label>
            <input type="password" name="password" placeholder="أدخل كلمة المرور" required>

            <button type="submit">🔐 تسجيل الدخول</button>
        </form>

    </div>
</body>

</html>
