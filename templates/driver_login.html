<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <title>مسارات - دخول السائق</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Tajawal', sans-serif;
            min-height: 100vh;
            background: linear-gradient(160deg, #3A2418 0%, #5A3D2D 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }

        /* ── Logo above card ── */
        .brand-logo {
            margin-bottom: 28px;
            display: flex;
            justify-content: center;
        }

        /* ── Card ── */
        .card {
            background: #FFFFFF;
            border-radius: 20px;
            padding: 40px 36px 32px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 12px 32px rgba(58, 36, 24, 0.12);
        }

        /* ── Card header with icon ── */
        .card-header {
            text-align: center;
            margin-bottom: 10px;
        }

        .icon-wrap {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            background: #FBF5EC;
            border: 1.5px solid #EFE3D0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            color: #E8A33B;
        }

        .card-header h1 {
            font-size: 1.35em;
            font-weight: 700;
            color: #3A2418;
            margin-bottom: 5px;
        }

        .card-header p {
            font-size: 0.85em;
            font-weight: 400;
            color: #8C6A50;
        }

        /* ── Welcome text ── */
        .welcome-text {
            text-align: center;
            color: #D26B3C;
            font-size: 0.95em;
            font-weight: 600;
            margin: 16px 0 28px;
            padding: 10px 16px;
            background: #FBF5EC;
            border-radius: 10px;
            border: 1px solid #EFE3D0;
        }

        /* ── Form ── */
        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;
            font-size: 0.82em;
            font-weight: 500;
            color: #5C3D2A;
            margin-bottom: 7px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 13px 16px;
            border: 1.5px solid #E8D8C4;
            border-radius: 10px;
            font-size: 1em;
            font-family: 'Tajawal', sans-serif;
            color: #3A2418;
            background: #FDFAF6;
            transition: border-color 0.25s, box-shadow 0.25s;
            text-align: right;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #D26B3C;
            background: #FFFFFF;
            box-shadow: 0 0 0 4px rgba(210, 107, 60, 0.18);
        }

        input::placeholder {
            color: #B89A82;
        }

        /* ── Amber button for driver ── */
        .login-btn {
            width: 100%;
            height: 56px;
            background: #E8A33B;
            color: #3A2418;
            border: none;
            border-radius: 14px;
            font-size: 1.05em;
            font-weight: 800;
            font-family: 'Tajawal', sans-serif;
            cursor: pointer;
            margin-top: 6px;
            transition: background 0.25s, transform 0.15s, box-shadow 0.25s;
            letter-spacing: 0.3px;
        }

        .login-btn:hover {
            background: #C8862A;
            color: #ffffff;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(232, 163, 59, 0.35);
        }

        .login-btn:active {
            transform: translateY(0);
            box-shadow: none;
        }

        /* ── Back link ── */
        .back-link {
            display: block;
            text-align: center;
            margin-top: 24px;
            color: rgba(255, 255, 255, 0.55);
            text-decoration: none;
            font-size: 0.88em;
            font-weight: 500;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #E8A33B;
        }
    </style>
</head>

<body>

    <div class="brand-logo">
        <svg width="200" height="54" viewBox="0 0 200 54" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="مسارات">
            <!-- Bus mark (amber on dark) -->
            <rect x="2" y="12" width="42" height="26" rx="6" fill="#E8A33B"/>
            <rect x="6" y="17" width="13" height="10" rx="2.5" fill="rgba(58,36,24,0.30)"/>
            <rect x="23" y="17" width="13" height="10" rx="2.5" fill="rgba(58,36,24,0.30)"/>
            <rect x="2" y="29" width="42" height="5" rx="1.5" fill="#C8862A"/>
            <circle cx="13" cy="41" r="4.5" fill="#3A2418"/>
            <circle cx="13" cy="41" r="2" fill="#E8A33B"/>
            <circle cx="34" cy="41" r="4.5" fill="#3A2418"/>
            <circle cx="34" cy="41" r="2" fill="#E8A33B"/>
            <rect x="37" y="15" width="7" height="5" rx="1.5" fill="#FBF5EC" opacity="0.8"/>
            <!-- "msarat" wordmark in white -->
            <text x="56" y="32" font-family="Tajawal, sans-serif" font-weight="800" font-size="20" fill="#FFFFFF" letter-spacing="-0.5">msarat</text>
            <!-- Arabic subtitle -->
            <text x="56" y="47" font-family="Tajawal, sans-serif" font-weight="500" font-size="12" fill="rgba(255,255,255,0.55)">مسارات</text>
        </svg>
    </div>

    <div class="card">
        <div class="card-header">
            <div class="icon-wrap">
                <i data-lucide="bus" style="width:28px;height:28px;"></i>
            </div>
            <h1>بوابة السائقين</h1>
            <p>Driver Portal</p>
        </div>

        <p class="welcome-text">مرحباً بك في نظام تتبع الحافلات</p>

        <form method="POST" action="/driver/login">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="field">
                <label>اسم المستخدم / Username</label>
                <input type="text" name="username" placeholder="أدخل اسم المستخدم" required autocomplete="username">
            </div>

            <div class="field">
                <label>كلمة المرور / Password</label>
                <input type="password" name="password" placeholder="أدخل كلمة المرور" required autocomplete="current-password">
            </div>

            <button type="submit" class="login-btn">تسجيل الدخول</button>
        </form>
    </div>

    <a href="/" class="back-link">العودة للرئيسية &larr;</a>

    <script>
        lucide.createIcons();
    </script>

</body>
</html>
