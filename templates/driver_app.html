<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <title>آمن مدرستي - لوحة السائق</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sage-green: #9FB8AD;
            --sage-dark: #7A9A8D;
            --gold: #F5C518;
            --gold-dark: #D4A914;
            --black: #1A1A1A;
            --cream: #F5F5F0;
            --white: #FFFFFF;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            margin: 0;
            background: var(--black);
            color: var(--cream);
        }

        .header {
            padding: 20px;
            background: linear-gradient(135deg, var(--black) 0%, #2d2d2d 100%);
            text-align: center;
            border-bottom: 3px solid var(--gold);
        }

        .header h2 {
            margin: 0;
            color: var(--gold);
        }

        .header small {
            color: var(--sage-green);
        }

        .status-box {
            padding: 25px;
            text-align: center;
            background: rgba(159, 184, 173, 0.1);
            margin: 15px;
            border-radius: 15px;
            border: 2px solid var(--sage-dark);
        }

        #gps-status {
            color: var(--gold);
            font-weight: bold;
            font-size: 1.1em;
        }

        #speed-display {
            font-size: 2.5em;
            color: var(--cream);
            font-weight: bold;
            margin-top: 10px;
        }

        .speed-label {
            font-size: 0.9em;
            color: var(--sage-green);
        }

        /* Big Buttons for Driver Safety */
        .big-btn {
            width: 90%;
            padding: 22px;
            font-size: 20px;
            border: none;
            border-radius: 15px;
            margin: 10px auto;
            display: block;
            cursor: pointer;
            font-weight: bold;
            font-family: 'Tajawal', sans-serif;
            transition: all 0.3s ease;
        }

        .big-btn:hover {
            transform: scale(1.02);
        }

        .btn-start {
            background: var(--gold);
            color: var(--black);
        }

        .btn-stop {
            background: #c0392b;
            color: white;
            display: none;
        }

        /* Attendance List Styles */
        .student-list {
            padding: 15px;
        }

        .section-title {
            color: var(--gold);
            text-align: center;
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .student-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--cream);
            color: var(--black);
            padding: 15px 20px;
            margin-bottom: 10px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .student-row span {
            font-weight: 500;
        }

        .toggle-btn {
            padding: 12px 20px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            font-family: 'Tajawal', sans-serif;
            transition: all 0.3s ease;
        }

        .btn-board {
            background: var(--sage-dark);
            color: var(--white);
        }

        .btn-board:hover {
            background: var(--black);
        }

        .btn-drop {
            background: var(--gold);
            color: var(--black);
        }

        .btn-drop:hover {
            background: var(--gold-dark);
        }

        .logout-link {
            display: block;
            text-align: center;
            padding: 15px;
            color: var(--sage-green);
            text-decoration: none;
            font-size: 0.9em;
        }

        .logout-link:hover {
            color: #c0392b;
        }

        .no-students {
            text-align: center;
            color: var(--sage-green);
            padding: 20px;
        }
    </style>
</head>

<body>

    <div class="header">
        <h2>🚌 الحافلة {{ plate_number }}</h2>
        <small>(رقم النظام: {{ bus_id }})</small>
    </div>

    <div class="status-box">
        <div id="gps-status">GPS: في الانتظار...</div>
        <div id="speed-display">0</div>
        <div class="speed-label">كم/ساعة</div>
    </div>

    <button class="big-btn btn-start" onclick="startTrip()">🟢 بدء الرحلة</button>
    <button class="big-btn btn-stop" onclick="stopTrip()">🔴 إنهاء الرحلة</button>

    <div class="student-list" id="student-container">
        <h3 class="section-title">📋 قائمة الطلاب</h3>
        <p class="no-students">سيظهر الطلاب هنا...</p>
    </div>

    <a href="/logout" class="logout-link">← تسجيل الخروج</a>

    <script>
        const socket = io();
        let watchId = null;
        const busId = "{{ bus_id }}";

        // --- LOAD MANIFEST ---
        function loadManifest() {
            fetch('/api/driver/manifest')
                .then(res => res.json())
                .then(students => {
                    const container = document.getElementById('student-container');
                    if (students.length === 0) {
                        container.innerHTML = '<h3 class="section-title">📋 قائمة الطلاب</h3><p class="no-students">لا يوجد طلاب مسجلين في هذه الرحلة</p>';
                        return;
                    }

                    let html = '<h3 class="section-title">📋 قائمة الطلاب</h3>';
                    students.forEach(s => {
                        const isBoarded = s.status === 'BOARDED';
                        const btnClass = isBoarded ? "btn-drop" : "btn-board";
                        const btnText = isBoarded ? "إنزال" : "صعود";

                        html += `
                        <div class="student-row">
                            <span>${s.name}</span>
                            <button class="toggle-btn ${btnClass}" onclick="toggleStudent(this, '${s.id}')">
                                ${btnText}
                            </button>
                        </div>`;
                    });
                    container.innerHTML = html;
                });
        }

        loadManifest();

        // --- GPS LOGIC ---
        function startTrip() {
            if (!navigator.geolocation) return alert("GPS غير مدعوم على هذا الجهاز");

            document.querySelector('.btn-start').style.display = 'none';
            document.querySelector('.btn-stop').style.display = 'block';

            watchId = navigator.geolocation.watchPosition(
                (position) => {
                    const data = {
                        bus_id: busId,
                        lat: position.coords.latitude,
                        lng: position.coords.longitude,
                        speed: Math.round(position.coords.speed * 3.6) || 0
                    };

                    document.getElementById('gps-status').innerText = "GPS: 🟢 يبث الآن";
                    document.getElementById('gps-status').style.color = "#27ae60";
                    document.getElementById('speed-display').innerText = data.speed;

                    socket.emit('driver_gps_update', data);
                },
                (error) => alert("خطأ GPS: " + error.message),
                { enableHighAccuracy: true, timeout: 5000 }
            );
        }

        function stopTrip() {
            navigator.geolocation.clearWatch(watchId);
            document.querySelector('.btn-start').style.display = 'block';
            document.querySelector('.btn-stop').style.display = 'none';
            document.getElementById('gps-status').innerText = "GPS: 🔴 متوقف";
            document.getElementById('gps-status').style.color = "#c0392b";
        }

        // --- ATTENDANCE LOGIC ---
        function toggleStudent(btn, studentId) {
            const isBoarding = btn.innerText.trim() === "صعود";

            if (isBoarding) {
                btn.innerText = "إنزال";
                btn.className = "toggle-btn btn-drop";
                socket.emit('manual_attendance', { student_id: studentId, status: "BOARDED", bus_id: busId });
            } else {
                btn.innerText = "صعود";
                btn.className = "toggle-btn btn-board";
                socket.emit('manual_attendance', { student_id: studentId, status: "DROPPED", bus_id: busId });
            }
        }
    </script>
</body>

</html>
