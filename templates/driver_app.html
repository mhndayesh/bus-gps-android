<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <title>سائق - آمن مدرستي</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js" integrity="sha384-DkkWv9oJFWLIydBXXjkBWnG1/fuVhw8YPBq37uvvD6WSYRFRqr21eY5Dg9ZhmWdy" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

    <style>
        * { box-sizing: border-box; }

        :root {
            --clay:        #D26B3C;
            --clay-dark:   #B85A2E;
            --amber:       #E8A33B;
            --amber-dark:  #C8882A;
            --cream:       #FBF5EC;
            --ink:         #3A2418;
            --ink-2:       #5A3D2D;
            --ink-4:       #A18A78;
            --sand:        #E8D8C4;
            --success:     #4A9D7A;
            --danger:      #D85F4A;
            --info:        #4A7BA8;
            --card:        #FFFFFF;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            margin: 0;
            background: var(--cream);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            max-width: 480px;
            margin: 0 auto;
        }

        /* ── HEADER ── */
        .header {
            background: linear-gradient(135deg, #2C1A10 0%, #3A2418 100%);
            color: #fff;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 12px rgba(58,36,24,0.25);
        }

        .header-left { display: flex; flex-direction: column; gap: 2px; }

        .header-plate {
            font-size: 1.1em;
            font-weight: 800;
            color: var(--amber);
            letter-spacing: 0.04em;
        }

        .header-sub {
            font-size: 0.75em;
            color: rgba(255,255,255,0.6);
        }

        .header-actions { display: flex; gap: 8px; align-items: center; }

        .gps-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 700;
            color: #fff;
        }

        .gps-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--ink-4);
            flex-shrink: 0;
            transition: background 0.4s;
        }
        .gps-dot.active {
            background: var(--success);
            box-shadow: 0 0 8px var(--success);
            animation: liveblink 1.5s infinite;
        }
        .gps-dot.error { background: var(--danger); }

        @keyframes liveblink { 0%,100% { opacity:1; } 50% { opacity:0.4; } }

        .icon-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: background 0.2s;
        }
        .icon-btn:active, .icon-btn:hover { background: rgba(255,255,255,0.2); }
        .icon-btn.cam-live {
            background: var(--danger);
            border-color: var(--danger);
            animation: liveblink 1.5s infinite;
        }

        /* ── PHASE SCREENS ── */
        .phase { display: none; flex-direction: column; flex: 1; }
        .phase.active { display: flex; }

        /* Phase 1: pre-trip */
        #phase-idle {
            padding: 20px 16px 24px;
            gap: 20px;
            align-items: center;
        }

        /* GPS Hero card */
        .gps-hero-card {
            width: 100%;
            background: linear-gradient(145deg, #3A2418 0%, #5A3D2D 100%);
            border-radius: 20px;
            padding: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 8px 24px rgba(58,36,24,0.2);
        }

        .gps-hero-left { display: flex; flex-direction: column; gap: 4px; }
        .gps-hero-label { font-size: 0.75em; color: rgba(255,255,255,0.5); font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; }
        .gps-hero-speed {
            font-size: 72px;
            font-weight: 800;
            color: #fff;
            line-height: 1;
        }
        .gps-hero-unit { font-size: 0.85em; color: var(--amber); font-weight: 700; }

        .gps-hero-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }

        .live-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(74,157,122,0.15);
            border: 1px solid rgba(74,157,122,0.3);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75em;
            font-weight: 700;
            color: var(--success);
        }

        .bus-badge {
            background: var(--card);
            border-radius: 20px;
            padding: 20px 28px;
            text-align: center;
            box-shadow: 0 4px 16px rgba(58,36,24,0.06);
            width: 100%;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .bus-badge-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, var(--clay) 0%, var(--amber) 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: #fff;
        }

        .bus-badge-info { text-align: right; }
        .bus-badge-plate { font-size: 1.3em; font-weight: 800; color: var(--ink); }
        .bus-badge-sub   { font-size: 0.8em; color: var(--ink-4); margin-top: 2px; }

        .idle-list { width: 100%; }
        .section-label {
            font-size: 0.75em;
            font-weight: 700;
            color: var(--ink-4);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin: 0 0 10px 4px;
        }

        /* Start button */
        .btn-start-big {
            width: 100%;
            min-height: 64px;
            background: linear-gradient(135deg, var(--clay) 0%, var(--clay-dark) 100%);
            color: #fff;
            border: none;
            border-radius: 14px;
            font-family: 'Tajawal', sans-serif;
            font-size: 1.2em;
            font-weight: 800;
            cursor: pointer;
            letter-spacing: 0.02em;
            box-shadow: 0 6px 20px rgba(210,107,60,0.35);
            transition: transform 0.15s, box-shadow 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-start-big:active {
            transform: scale(0.97);
            box-shadow: 0 3px 10px rgba(210,107,60,0.3);
        }

        /* Phase 2: in-trip */
        #phase-trip { padding: 0; }

        .trip-header {
            background: var(--card);
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--sand);
        }

        .trip-count {
            font-weight: 700;
            font-size: 1em;
            color: var(--ink);
        }
        .trip-count-label { font-weight: 400; color: var(--ink-4); font-size: 0.85em; }

        .trip-speed-display {
            font-size: 1.6em;
            font-weight: 800;
            color: var(--clay);
            display: flex;
            align-items: baseline;
            gap: 4px;
        }
        .trip-speed-unit { font-size: 0.5em; font-weight: 500; color: var(--ink-4); }

        .student-list { padding: 12px; flex: 1; overflow-y: auto; }

        /* Student manifest rows */
        .student-card {
            background: var(--card);
            border-radius: 14px;
            margin-bottom: 10px;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(58,36,24,0.06);
            display: flex;
            align-items: center;
            transition: box-shadow 0.2s;
        }
        .student-card.boarded { border-right: 4px solid var(--success); }
        .student-card.missing { border-right: 4px solid var(--sand); }

        .student-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1em;
            font-weight: 800;
            flex-shrink: 0;
            margin: 12px 0 12px 12px;
            color: #fff;
        }
        .avatar-boarded { background: linear-gradient(135deg, var(--success) 0%, #3a8a6a 100%); }
        .avatar-waiting  { background: linear-gradient(135deg, var(--ink-4) 0%, var(--ink-2) 100%); }

        .student-info {
            flex: 1;
            padding: 14px 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .student-name  { font-size: 1em; font-weight: 700; color: var(--ink); }
        .student-status-badge {
            display: inline-block;
            margin-top: 3px;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.72em;
            font-weight: 700;
        }
        .badge-boarded { background: rgba(74,157,122,0.1); color: var(--success); }
        .badge-waiting  { background: rgba(161,138,120,0.12); color: var(--ink-4); }

        .student-toggle {
            border: none;
            cursor: pointer;
            min-width: 70px;
            min-height: 44px;
            margin: 10px;
            border-radius: 10px;
            font-family: 'Tajawal', sans-serif;
            font-size: 0.85em;
            font-weight: 700;
            transition: opacity 0.2s, transform 0.15s;
        }
        .student-toggle:active { transform: scale(0.95); }
        .toggle-board { background: rgba(210,107,60,0.12); color: var(--clay); }
        .toggle-board:hover { background: rgba(210,107,60,0.2); }
        .toggle-drop  { background: rgba(232,163,59,0.12); color: var(--amber-dark); }
        .toggle-drop:hover  { background: rgba(232,163,59,0.22); }

        /* Trip actions */
        .trip-actions {
            padding: 12px 16px;
            background: var(--card);
            border-top: 1px solid var(--sand);
            display: flex;
            gap: 10px;
        }

        .btn-stop-big {
            flex: 1;
            min-height: 64px;
            background: linear-gradient(135deg, var(--danger) 0%, #be4e3b 100%);
            color: #fff;
            border: none;
            border-radius: 14px;
            font-family: 'Tajawal', sans-serif;
            font-size: 1.1em;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(216,95,74,0.3);
            transition: transform 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-stop-big:active { transform: scale(0.97); }

        .btn-route {
            min-width: 64px;
            min-height: 64px;
            background: var(--card);
            border: 1.5px solid var(--sand);
            color: var(--info);
            border-radius: 14px;
            font-family: 'Tajawal', sans-serif;
            font-size: 0.9em;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .btn-route:hover { background: rgba(74,123,168,0.06); }

        /* ── MAP SHEET ── */
        .map-sheet-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(58,36,24,0.45);
            z-index: 200;
            align-items: flex-end;
        }
        .map-sheet-overlay.open { display: flex; }

        .map-sheet {
            background: var(--cream);
            width: 100%;
            border-radius: 24px 24px 0 0;
            padding: 20px 16px 32px;
            max-width: 480px;
            margin: 0 auto;
        }

        .sheet-handle {
            width: 40px;
            height: 4px;
            background: var(--sand);
            border-radius: 2px;
            margin: 0 auto 16px;
        }

        .sheet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .sheet-title { margin: 0; font-size: 1em; font-weight: 700; color: var(--ink); }

        .sheet-close {
            background: var(--sand);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            color: var(--ink-2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9em;
        }

        #map { height: 260px; border-radius: 16px; }

        .route-result {
            margin-top: 12px;
            font-size: 0.85em;
            color: var(--ink-2);
            max-height: 120px;
            overflow-y: auto;
        }
        .route-stop {
            padding: 7px 0;
            border-bottom: 1px solid var(--sand);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .route-stop:last-child { border-bottom: none; }

        .btn-optimize {
            width: 100%;
            margin-top: 12px;
            min-height: 52px;
            background: linear-gradient(135deg, var(--info) 0%, #3a6a96 100%);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-family: 'Tajawal', sans-serif;
            font-weight: 700;
            font-size: 0.95em;
            cursor: pointer;
        }

        /* ── CAMERA SHEET ── */
        .camera-sheet-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            z-index: 200;
            align-items: flex-end;
        }
        .camera-sheet-overlay.open { display: flex; }

        .camera-sheet {
            background: #0D0D0D;
            width: 100%;
            border-radius: 24px 24px 0 0;
            padding: 16px 16px 32px;
            max-width: 480px;
            margin: 0 auto;
        }

        .camera-sheet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .camera-sheet-header h3 { margin: 0; color: #fff; font-size: 1em; font-weight: 700; }

        #camera-preview { width: 100%; border-radius: 16px; background: #111; display: block; min-height: 200px; }
        #canvas-capture { display: none; }

        .camera-controls { display: flex; gap: 10px; margin-top: 12px; }

        .cam-btn {
            flex: 1;
            min-height: 52px;
            border: none;
            border-radius: 12px;
            font-family: 'Tajawal', sans-serif;
            font-size: 0.9em;
            font-weight: 700;
            cursor: pointer;
        }
        .cam-btn-start { background: var(--danger); color: #fff; }
        .cam-btn-flip  { background: #333; color: #fff; }
        .cam-btn-close { background: #222; color: #aaa; flex: 0; padding: 0 20px; }

        /* ── ATTENDANCE MODAL ── */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(58,36,24,0.6);
            z-index: 300;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.open { display: flex; }

        .modal-card {
            background: var(--card);
            border-radius: 24px;
            padding: 32px 24px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(58,36,24,0.25);
        }

        .modal-icon-ring {
            width: 64px;
            height: 64px;
            background: rgba(216,95,74,0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            color: var(--danger);
        }

        .modal-title { font-size: 1.15em; font-weight: 800; color: var(--danger); margin-bottom: 6px; }
        .modal-msg   { color: var(--ink-4); font-size: 0.9em; margin-bottom: 16px; }

        .missing-list {
            background: rgba(216,95,74,0.06);
            border: 1px solid rgba(216,95,74,0.15);
            border-radius: 12px;
            padding: 12px 16px;
            text-align: right;
            max-height: 160px;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .missing-student {
            padding: 8px 0;
            border-bottom: 1px solid rgba(216,95,74,0.12);
            color: var(--danger);
            font-weight: 600;
            font-size: 0.9em;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .missing-student:last-child { border-bottom: none; }

        .modal-buttons { display: flex; flex-direction: column; gap: 10px; }

        .modal-btn {
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-family: 'Tajawal', sans-serif;
            font-size: 0.95em;
            font-weight: 700;
            cursor: pointer;
            min-height: 52px;
        }
        .modal-btn-force   { background: linear-gradient(135deg, var(--clay) 0%, var(--clay-dark) 100%); color: #fff; }
        .modal-btn-recheck { background: var(--sand); color: var(--ink); }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 32px 16px;
            color: var(--ink-4);
        }
        .empty-state p { margin: 8px 0 0; font-size: 0.9em; }
    </style>
</head>
<body>

<!-- ── HEADER ── -->
<header class="header">
    <div class="header-left">
        <div class="header-plate" id="h-plate">{{ plate_number }}</div>
        <div class="header-sub" id="h-sub">لوحة السائق</div>
    </div>
    <div class="header-actions">
        <div class="gps-pill">
            <div class="gps-dot" id="gps-dot"></div>
            <span id="speed-val">0</span>&nbsp;<span id="h-kmh">كم/س</span>
        </div>
        <button class="icon-btn" id="cam-icon-btn" onclick="openCameraSheet()" title="Camera">
            <i data-lucide="video" style="width:16px;height:16px;"></i>
        </button>
        <button class="icon-btn" onclick="toggleLang()" id="lang-btn" title="Language">EN</button>
        <a href="/logout" class="icon-btn" title="Logout">
            <i data-lucide="log-out" style="width:16px;height:16px;"></i>
        </a>
    </div>
</header>

<!-- ════════ PHASE 1: IDLE ════════ -->
<section class="phase active" id="phase-idle">

    <!-- GPS Hero -->
    <div class="gps-hero-card">
        <div class="gps-hero-left">
            <span class="gps-hero-label" id="idle-speed-label">السرعة</span>
            <div class="gps-hero-speed" id="hero-speed">0</div>
            <span class="gps-hero-unit" id="idle-kmh-label">كم/س</span>
        </div>
        <div class="gps-hero-right">
            <div class="live-badge" id="live-badge">
                <div class="gps-dot" id="gps-dot-hero"></div>
                <span id="gps-status-label">GPS</span>
            </div>
        </div>
    </div>

    <!-- Bus badge -->
    <div class="bus-badge">
        <div class="bus-badge-icon">
            <i data-lucide="bus" style="width:28px;height:28px;"></i>
        </div>
        <div class="bus-badge-info">
            <div class="bus-badge-plate">{{ plate_number }}</div>
            <div class="bus-badge-sub" id="idle-ready">جاهز للرحلة</div>
        </div>
    </div>

    <!-- Student list before trip -->
    <div class="idle-list">
        <p class="section-label" id="idle-list-title">قائمة الطلاب — سجّل الحضور قبل البدء</p>
        <div id="idle-student-container">
            <div class="empty-state">
                <i data-lucide="loader" style="width:24px;height:24px;color:var(--ink-4);"></i>
                <p id="idle-loading">جاري التحميل...</p>
            </div>
        </div>
    </div>

    <button class="btn-start-big" onclick="startTrip()" id="btn-start">
        <i data-lucide="play-circle" style="width:22px;height:22px;"></i>
        <span id="start-label">بدء الرحلة</span>
    </button>

</section>

<!-- ════════ PHASE 2: IN-TRIP ════════ -->
<section class="phase" id="phase-trip">

    <div class="trip-header">
        <div class="trip-count" id="trip-count">
            0 / 0 <span class="trip-count-label" id="trip-count-label">صعدوا</span>
        </div>
        <div class="trip-speed-display">
            <span id="trip-speed">0</span>
            <span class="trip-speed-unit" id="trip-kmh">كم/س</span>
        </div>
    </div>

    <div class="student-list" id="trip-student-container">
        <!-- populated by JS -->
    </div>

    <div class="trip-actions">
        <button class="btn-route" onclick="openRouteSheet()" id="btn-route" title="Route">
            <i data-lucide="map" style="width:20px;height:20px;"></i>
        </button>
        <button class="btn-stop-big" onclick="stopTrip()" id="btn-stop">
            <i data-lucide="stop-circle" style="width:20px;height:20px;"></i>
            <span id="stop-label">إنهاء الرحلة</span>
        </button>
    </div>

</section>

<!-- ════════ MAP SHEET ════════ -->
<div class="map-sheet-overlay" id="map-sheet-overlay" onclick="closeRouteSheet(event)">
    <div class="map-sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-header">
            <h3 class="sheet-title" id="route-title">المسار الأمثل</h3>
            <button class="sheet-close" onclick="closeRouteSheet()">
                <i data-lucide="x" style="width:14px;height:14px;"></i>
            </button>
        </div>
        <div id="map"></div>
        <div class="route-result" id="route-result"></div>
        <button class="btn-optimize" id="btn-optimize" onclick="optimizeRoute()">
            <span id="optimize-label">احسب المسار الأسرع</span>
        </button>
    </div>
</div>

<!-- ════════ CAMERA SHEET ════════ -->
<div class="camera-sheet-overlay" id="camera-sheet-overlay">
    <div class="camera-sheet">
        <div class="camera-sheet-header">
            <h3 id="cam-title">البث المباشر</h3>
            <button class="cam-btn cam-btn-close" onclick="closeCameraSheet()">
                <i data-lucide="x" style="width:14px;height:14px;"></i>
            </button>
        </div>
        <video id="camera-preview" autoplay playsinline muted></video>
        <canvas id="canvas-capture"></canvas>
        <div class="camera-controls">
            <button class="cam-btn cam-btn-start" id="cam-toggle-btn" onclick="toggleCamera()">
                <span id="cam-toggle-label">بدء البث</span>
            </button>
            <button class="cam-btn cam-btn-flip" id="cam-flip-btn" onclick="flipCamera()" style="display:none;">
                <i data-lucide="flip-horizontal-2" style="width:16px;height:16px;"></i>
            </button>
        </div>
    </div>
</div>

<!-- ════════ ATTENDANCE MODAL ════════ -->
<div class="modal-overlay" id="attendance-modal" role="dialog" aria-modal="true">
    <div class="modal-card">
        <div class="modal-icon-ring">
            <i data-lucide="alert-triangle" style="width:28px;height:28px;"></i>
        </div>
        <div class="modal-title" id="modal-title">طلاب لم يصعدوا!</div>
        <div class="modal-msg"   id="modal-msg">الطلاب التالية أسماؤهم لم يُسجَّل صعودهم:</div>
        <div class="missing-list" id="missing-students-list"></div>
        <div class="modal-buttons">
            <button class="modal-btn modal-btn-force" onclick="forceStartTrip()" id="modal-force">
                بدء الرحلة على أي حال
            </button>
            <button class="modal-btn modal-btn-recheck" onclick="recheckAttendance()" id="modal-recheck">
                إعادة الفحص
            </button>
        </div>
    </div>
</div>

<script>
    // ── INIT LUCIDE ICONS ──────────────────────────────────────────────────────
    lucide.createIcons();

    // ── CONSTANTS ──────────────────────────────────────────────────────────────
    const socket = io();
    const busId  = "{{ bus_id }}";

    let watchId       = null;
    let _allStudents  = [];
    let _routeActive  = false;
    let _driverLat    = null;
    let _driverLng    = null;

    // Camera
    let cameraStream  = null;
    let frameInterval = null;
    let isStreaming   = false;
    let useFrontCamera = false;
    const FRAME_RATE    = 10;
    const FRAME_QUALITY = 0.6;

    // ── LANGUAGE ───────────────────────────────────────────────────────────────
    const LANG = {
        ar: {
            sub: 'لوحة السائق',
            kmh: 'كم/س',
            idleReady: 'جاهز للرحلة',
            idleListTitle: 'قائمة الطلاب — سجّل الحضور قبل البدء',
            startLabel: 'بدء الرحلة',
            stopLabel: 'إنهاء الرحلة',
            tripCountLabel: 'صعدوا',
            tripKmh: 'كم/س',
            routeTitle: 'المسار الأمثل',
            optimizeLabel: 'احسب المسار الأسرع',
            optimizingLabel: 'جاري الحساب...',
            camTitle: 'البث المباشر',
            camStart: 'بدء البث',
            camStop: 'إيقاف البث',
            board: 'صعود',
            drop: 'إنزال',
            boarded: 'على المتن',
            waiting: 'ينتظر',
            noStudents: 'لا يوجد طلاب مسجلون في هذه الرحلة',
            loading: 'جاري التحميل...',
            errLoad: 'تعذّر تحميل قائمة الطلاب. تحقّق من الاتصال.',
            modalTitle: 'طلاب لم يصعدوا!',
            modalMsg: 'الطلاب التالية أسماؤهم لم يُسجَّل صعودهم:',
            modalForce: 'بدء الرحلة على أي حال',
            modalRecheck: 'إعادة الفحص',
            routeEmpty: 'لا يوجد طلاب على متن الحافلة حالياً.',
            routeStop: 'توقف',
            gpsWait: 'GPS…',
            gpsActive: 'GPS يبث',
            gpsOff: 'GPS متوقف',
            gpsError: 'GPS خطأ',
        },
        en: {
            sub: 'Driver Dashboard',
            kmh: 'km/h',
            idleReady: 'Ready for trip',
            idleListTitle: 'Students — check attendance before starting',
            startLabel: 'Start Trip',
            stopLabel: 'End Trip',
            tripCountLabel: 'on board',
            tripKmh: 'km/h',
            routeTitle: 'Optimal Route',
            optimizeLabel: 'Calculate Route',
            optimizingLabel: 'Calculating...',
            camTitle: 'Live Camera',
            camStart: 'Start Stream',
            camStop: 'Stop Stream',
            board: 'Board',
            drop: 'Drop',
            boarded: 'On board',
            waiting: 'Waiting',
            noStudents: 'No students assigned to this trip',
            loading: 'Loading...',
            errLoad: 'Failed to load students. Check connection.',
            modalTitle: 'Students not boarded!',
            modalMsg: 'The following students have not been marked as boarded:',
            modalForce: 'Start Trip Anyway',
            modalRecheck: 'Recheck',
            routeEmpty: 'No students are currently on the bus.',
            routeStop: 'Stop',
            gpsWait: 'GPS…',
            gpsActive: 'GPS live',
            gpsOff: 'GPS off',
            gpsError: 'GPS error',
        }
    };
    let lang = localStorage.getItem('driver_lang') || 'ar';

    function t(key) { return LANG[lang][key] || key; }

    function applyLang() {
        document.documentElement.lang = lang;
        document.documentElement.dir  = lang === 'ar' ? 'rtl' : 'ltr';
        document.getElementById('lang-btn').innerText        = lang === 'ar' ? 'EN' : 'ع';
        document.getElementById('h-sub').innerText           = t('sub');
        document.getElementById('h-kmh').innerText           = t('kmh');
        document.getElementById('idle-kmh-label').innerText  = t('kmh');
        document.getElementById('idle-ready').innerText      = t('idleReady');
        document.getElementById('idle-list-title').innerText = t('idleListTitle');
        document.getElementById('start-label').innerText     = t('startLabel');
        document.getElementById('stop-label').innerText      = t('stopLabel');
        document.getElementById('trip-count-label').innerText = t('tripCountLabel');
        document.getElementById('trip-kmh').innerText        = t('tripKmh');
        document.getElementById('route-title').innerText     = t('routeTitle');
        document.getElementById('optimize-label').innerText  = t('optimizeLabel');
        document.getElementById('cam-title').innerText       = t('camTitle');
        document.getElementById('cam-toggle-label').innerText = isStreaming ? t('camStop') : t('camStart');
        document.getElementById('modal-title').innerText     = t('modalTitle');
        document.getElementById('modal-msg').innerText       = t('modalMsg');
        document.getElementById('modal-force').innerText     = t('modalForce');
        document.getElementById('modal-recheck').innerText   = t('modalRecheck');
        renderIdleList();
        renderTripList();
    }

    function toggleLang() {
        lang = lang === 'ar' ? 'en' : 'ar';
        localStorage.setItem('driver_lang', lang);
        applyLang();
    }

    // ── HELPERS ────────────────────────────────────────────────────────────────
    function escapeHtml(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
            ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function getInitial(name) {
        if (!name) return '?';
        return String(name).trim()[0].toUpperCase();
    }

    function setGps(state, speed) {
        const dots = [document.getElementById('gps-dot'), document.getElementById('gps-dot-hero')];
        const spd1 = document.getElementById('speed-val');
        const spd2 = document.getElementById('trip-speed');
        const hero = document.getElementById('hero-speed');
        dots.forEach(dot => {
            if (!dot) return;
            dot.className = 'gps-dot ' + (state === 'active' ? 'active' : state === 'error' ? 'error' : '');
        });
        if (speed !== undefined) {
            spd1.innerText = speed;
            spd2.innerText = speed;
            hero.innerText = speed;
        }
        const statusLabel = document.getElementById('gps-status-label');
        if (statusLabel) {
            statusLabel.innerText = state === 'active' ? t('gpsActive') : state === 'error' ? t('gpsError') : t('gpsWait');
        }
    }

    function updateTripCounter() {
        const boarded = _allStudents.filter(s => s.status === 'BOARDED').length;
        document.getElementById('trip-count').innerHTML =
            `${boarded} / ${_allStudents.length} <span class="trip-count-label" id="trip-count-label">${t('tripCountLabel')}</span>`;
    }

    // ── DATA ───────────────────────────────────────────────────────────────────
    function loadManifest() {
        fetch('/api/driver/manifest')
            .then(r => r.json())
            .then(students => {
                _allStudents = students;
                renderIdleList();
                renderTripList();
                updateTripCounter();
            })
            .catch(() => {
                document.getElementById('idle-student-container').innerHTML =
                    `<div class="empty-state" style="color:var(--danger);">${t('errLoad')}</div>`;
            });
    }

    function renderIdleList() {
        const c = document.getElementById('idle-student-container');
        if (!_allStudents.length) {
            c.innerHTML = `<div class="empty-state"><p>${t('noStudents')}</p></div>`;
            return;
        }
        c.innerHTML = _allStudents.map(s => {
            const boarded   = s.status === 'BOARDED';
            const avatarCls = boarded ? 'avatar-boarded' : 'avatar-waiting';
            const badgeCls  = boarded ? 'badge-boarded'  : 'badge-waiting';
            const badge     = boarded ? t('boarded')     : t('waiting');
            const btnCls    = boarded ? 'toggle-drop'    : 'toggle-board';
            const btnTxt    = boarded ? t('drop')        : t('board');
            return `
            <div class="student-card ${boarded ? 'boarded' : 'missing'}" id="idle-card-${escapeHtml(s.id)}">
                <div class="student-avatar ${avatarCls}">${getInitial(s.name)}</div>
                <div class="student-info">
                    <div class="student-name">${escapeHtml(s.name)}</div>
                    <span class="student-status-badge ${badgeCls}">${badge}</span>
                </div>
                <button class="student-toggle ${btnCls}" onclick="toggleStudent('${escapeHtml(s.id)}')">${btnTxt}</button>
            </div>`;
        }).join('');
    }

    function renderTripList() {
        const c = document.getElementById('trip-student-container');
        if (!_allStudents.length) {
            c.innerHTML = `<div class="empty-state"><p>${t('noStudents')}</p></div>`;
            return;
        }
        c.innerHTML = _allStudents.map(s => {
            const boarded   = s.status === 'BOARDED';
            const avatarCls = boarded ? 'avatar-boarded' : 'avatar-waiting';
            const badgeCls  = boarded ? 'badge-boarded'  : 'badge-waiting';
            const badge     = boarded ? t('boarded')     : t('waiting');
            const btnCls    = boarded ? 'toggle-drop'    : 'toggle-board';
            const btnTxt    = boarded ? t('drop')        : t('board');
            return `
            <div class="student-card ${boarded ? 'boarded' : 'missing'}" id="trip-card-${escapeHtml(s.id)}">
                <div class="student-avatar ${avatarCls}">${getInitial(s.name)}</div>
                <div class="student-info">
                    <div class="student-name">${escapeHtml(s.name)}</div>
                    <span class="student-status-badge ${badgeCls}">${badge}</span>
                </div>
                <button class="student-toggle ${btnCls}" onclick="toggleStudent('${escapeHtml(s.id)}')">${btnTxt}</button>
            </div>`;
        }).join('');
    }

    // ── ATTENDANCE ─────────────────────────────────────────────────────────────
    function toggleStudent(studentId) {
        const s = _allStudents.find(x => x.id == studentId);
        if (!s) return;
        const nowBoarding = s.status !== 'BOARDED';
        s.status = nowBoarding ? 'BOARDED' : 'DROPPED';

        socket.emit('manual_attendance', {
            student_id: studentId,
            status: s.status,
            bus_id: busId
        });

        if (!nowBoarding && _routeActive) setTimeout(() => _calcRoute(true), 3000);

        renderIdleList();
        renderTripList();
        updateTripCounter();
    }

    // ── SOCKET EVENT HANDLERS ──────────────────────────────────────────────────
    socket.on('student_status_update', function(data) {
        const s = _allStudents.find(x => x.id == data.student_id);
        if (s) {
            s.status = data.status;
            renderIdleList();
            renderTripList();
            updateTripCounter();
        }
    });

    socket.on('update_map', function(data) {
        // Handled by parent/admin maps; no action needed in driver app
    });

    socket.on('bus_camera_frame', function(data) {
        // Camera frames are sent TO admin; driver sends them outbound
    });

    // ── TRIP CONTROL ───────────────────────────────────────────────────────────
    function startTrip() {
        if (!navigator.geolocation) return alert(lang === 'ar' ? 'GPS غير مدعوم' : 'GPS not supported');
        fetch('/api/driver/manifest')
            .then(r => r.json())
            .then(students => {
                _allStudents = students;
                const missing = students.filter(s => s.status !== 'BOARDED');
                if (missing.length) {
                    document.getElementById('missing-students-list').innerHTML =
                        missing.map(s => `<div class="missing-student"><i data-lucide="x-circle" style="width:14px;height:14px;flex-shrink:0;"></i>${escapeHtml(s.name)}</div>`).join('');
                    document.getElementById('attendance-modal').classList.add('open');
                    lucide.createIcons();
                } else {
                    actuallyStartTrip();
                }
            })
            .catch(() => actuallyStartTrip());
    }

    function recheckAttendance() {
        document.getElementById('attendance-modal').classList.remove('open');
        loadManifest();
    }

    function forceStartTrip() {
        document.getElementById('attendance-modal').classList.remove('open');
        actuallyStartTrip();
    }

    function actuallyStartTrip() {
        _routeActive = true;
        document.getElementById('phase-idle').classList.remove('active');
        document.getElementById('phase-trip').classList.add('active');

        watchId = navigator.geolocation.watchPosition(
            pos => {
                _driverLat = pos.coords.latitude;
                _driverLng = pos.coords.longitude;
                const speed = Math.round((pos.coords.speed || 0) * 3.6);
                setGps('active', speed);

                if (routeMap) {
                    if (busMarker) busMarker.setLatLng([_driverLat, _driverLng]);
                    else {
                        busMarker = L.marker([_driverLat, _driverLng], {
                            icon: L.divIcon({ html: '<div style="background:var(--clay);width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;">&#128652;</div>', className: '', iconSize: [32,32] })
                        }).addTo(routeMap).bindPopup(lang === 'ar' ? 'موقعك الحالي' : 'Your location');
                        routeMap.panTo([_driverLat, _driverLng]);
                    }
                }

                socket.emit('driver_gps_update', {
                    bus_id: busId, lat: _driverLat, lng: _driverLng, speed
                });
            },
            err => setGps('error'),
            { enableHighAccuracy: true, timeout: 5000 }
        );
    }

    function stopTrip() {
        if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
        _routeActive = false;
        setGps('', 0);
        if (isStreaming) stopCamera();
        document.getElementById('phase-trip').classList.remove('active');
        document.getElementById('phase-idle').classList.add('active');
        loadManifest();
    }

    // ── MAP / ROUTE ────────────────────────────────────────────────────────────
    let routeMap = null, routeLayer = null, busMarker = null;

    function openRouteSheet() {
        document.getElementById('map-sheet-overlay').classList.add('open');
        if (!routeMap) {
            routeMap = L.map('map').setView([21.543333, 39.172778], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(routeMap);
        }
        setTimeout(() => routeMap.invalidateSize(), 100);
    }

    function closeRouteSheet(e) {
        if (e && e.target !== document.getElementById('map-sheet-overlay')) return;
        document.getElementById('map-sheet-overlay').classList.remove('open');
    }

    function optimizeRoute() { _calcRoute(false); }

    function _calcRoute(silent) {
        const btn = document.getElementById('btn-optimize');
        if (!silent) { btn.querySelector('span').innerText = t('optimizingLabel'); btn.disabled = true; }

        const doFetch = (lat, lng) => {
            fetch(`/api/optimize_route/${busId}?lat=${lat}&lng=${lng}`)
                .then(r => r.json())
                .then(data => {
                    if (!silent) { btn.querySelector('span').innerText = t('optimizeLabel'); btn.disabled = false; }
                    if (data.status === 'empty') {
                        if (!silent) document.getElementById('route-result').innerText = t('routeEmpty');
                        return;
                    }
                    if (data.stops) {
                        if (routeLayer) routeMap.removeLayer(routeLayer);
                        const latlngs = [[lat, lng], ...data.stops.map(s => [s.lat, s.lng])];
                        routeLayer = L.polyline(latlngs, { color: '#D26B3C', weight: 4, opacity: 0.85 }).addTo(routeMap);
                        routeMap.fitBounds(routeLayer.getBounds(), { padding: [20,20] });
                        data.stops.forEach((s, i) =>
                            L.marker([s.lat, s.lng]).addTo(routeMap).bindPopup(`${i+1}. ${s.name}`)
                        );
                        document.getElementById('route-result').innerHTML =
                            data.stops.map((s, i) =>
                                `<div class="route-stop"><span style="color:var(--clay);font-weight:700;">${i+1}.</span> ${escapeHtml(s.name)}</div>`
                            ).join('');
                    }
                })
                .catch(() => {
                    if (!silent) { btn.querySelector('span').innerText = t('optimizeLabel'); btn.disabled = false; }
                });
        };

        if (_driverLat && _driverLng) { doFetch(_driverLat, _driverLng); return; }
        navigator.geolocation.getCurrentPosition(
            pos => doFetch(pos.coords.latitude, pos.coords.longitude),
            () => { if (!silent) { btn.querySelector('span').innerText = t('optimizeLabel'); btn.disabled = false; } },
            { enableHighAccuracy: true, timeout: 5000 }
        );
    }

    // ── CAMERA ─────────────────────────────────────────────────────────────────
    function openCameraSheet()  { document.getElementById('camera-sheet-overlay').classList.add('open'); }
    function closeCameraSheet() { document.getElementById('camera-sheet-overlay').classList.remove('open'); }

    async function toggleCamera() {
        isStreaming ? stopCamera() : await startCamera();
    }

    async function startCamera() {
        try {
            cameraStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: useFrontCamera ? 'user' : 'environment', width:{ideal:640}, height:{ideal:480} },
                audio: false
            });
            const video = document.getElementById('camera-preview');
            video.srcObject = cameraStream;
            await video.play();
            isStreaming = true;
            document.getElementById('cam-icon-btn').classList.add('cam-live');
            document.getElementById('cam-toggle-label').innerText = t('camStop');
            document.getElementById('cam-flip-btn').style.display = '';
            socket.emit('camera_stream_start', { bus_id: busId });
            startFrameCapture();
        } catch (err) {
            alert((lang==='ar'?'خطأ في الكاميرا: ':'Camera error: ') + err.message);
        }
    }

    function stopCamera() {
        if (frameInterval) { clearInterval(frameInterval); frameInterval = null; }
        if (cameraStream)  { cameraStream.getTracks().forEach(t => t.stop()); cameraStream = null; }
        const video = document.getElementById('camera-preview');
        video.srcObject = null;
        isStreaming = false;
        document.getElementById('cam-icon-btn').classList.remove('cam-live');
        document.getElementById('cam-toggle-label').innerText = t('camStart');
        document.getElementById('cam-flip-btn').style.display = 'none';
        socket.emit('camera_stream_stop', { bus_id: busId });
    }

    function startFrameCapture() {
        const video  = document.getElementById('camera-preview');
        const canvas = document.getElementById('canvas-capture');
        const ctx    = canvas.getContext('2d');
        canvas.width  = video.videoWidth  || 640;
        canvas.height = video.videoHeight || 480;
        frameInterval = setInterval(() => {
            if (!isStreaming || !video.videoWidth) return;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            socket.emit('camera_frame', {
                bus_id: busId, frame: canvas.toDataURL('image/jpeg', FRAME_QUALITY), timestamp: Date.now()
            });
        }, 1000 / FRAME_RATE);
    }

    async function flipCamera() {
        if (!isStreaming) return;
        useFrontCamera = !useFrontCamera;
        if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
        if (frameInterval) { clearInterval(frameInterval); frameInterval = null; }
        try {
            cameraStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: useFrontCamera ? 'user' : 'environment', width:{ideal:640}, height:{ideal:480} },
                audio: false
            });
            const video = document.getElementById('camera-preview');
            video.srcObject = cameraStream;
            await video.play();
            startFrameCapture();
        } catch (err) {
            useFrontCamera = !useFrontCamera;
            await startCamera();
        }
    }

    // ── INIT ───────────────────────────────────────────────────────────────────
    applyLang();
    loadManifest();
    lucide.createIcons();
</script>
</body>
</html>
