<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <title>سائق - آمن مدرستي</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js" integrity="sha384-DkkWv9oJFWLIydBXXjkBWnG1/fuVhw8YPBq37uvvD6WSYRFRqr21eY5Dg9ZhmWdy" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }

        :root {
            --primary: #1a1a2e;
            --green:   #27ae60;
            --red:     #e74c3c;
            --orange:  #f39c12;
            --blue:    #2980b9;
            --bg:      #f0f2f5;
            --card:    #ffffff;
            --border:  #e0e4ea;
            --text:    #1a1a2e;
            --muted:   #7f8c8d;
            --gold:    #f5c518;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── HEADER ── */
        .header {
            background: var(--primary);
            color: #fff;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,.25);
        }

        .header-title { font-size: 1.1em; font-weight: 700; }
        .header-sub   { font-size: 0.75em; color: var(--gold); margin-top: 2px; }

        .header-actions { display: flex; gap: 10px; align-items: center; }

        .gps-pill {
            display: flex; align-items: center; gap: 6px;
            background: rgba(255,255,255,.1);
            padding: 6px 12px; border-radius: 20px; font-size: 0.8em; font-weight: 600;
        }
        .gps-dot {
            width: 10px; height: 10px; border-radius: 50%;
            background: var(--muted); flex-shrink: 0;
            transition: background .4s;
        }
        .gps-dot.active  { background: var(--green); box-shadow: 0 0 6px var(--green); }
        .gps-dot.error   { background: var(--red); }

        .icon-btn {
            background: rgba(255,255,255,.12); border: none; color: #fff;
            width: 38px; height: 38px; border-radius: 10px;
            font-size: 1.1em; cursor: pointer; display: flex;
            align-items: center; justify-content: center;
        }
        .icon-btn:active { background: rgba(255,255,255,.25); }
        .icon-btn.cam-live { background: var(--red); animation: pulse 1.5s infinite; }

        @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.65; } }

        /* ── PHASE SCREENS ── */
        .phase { display: none; flex-direction: column; flex: 1; }
        .phase.active { display: flex; }

        /* Phase 1: pre-trip */
        #phase-idle {
            justify-content: center; align-items: center;
            padding: 24px; gap: 24px;
        }

        .bus-badge {
            background: var(--card); border-radius: 20px;
            padding: 24px 36px; text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,.08);
            width: 100%; max-width: 360px;
        }
        .bus-badge .bus-icon { font-size: 3.5em; }
        .bus-badge h2 { margin: 10px 0 4px; font-size: 1.5em; }
        .bus-badge p  { margin: 0; color: var(--muted); font-size: 0.9em; }

        .btn-start-big {
            width: 100%; max-width: 360px;
            padding: 24px;
            background: var(--green); color: #fff;
            border: none; border-radius: 20px;
            font-family: 'Tajawal', sans-serif;
            font-size: 1.5em; font-weight: 800;
            cursor: pointer; letter-spacing: .02em;
            box-shadow: 0 8px 24px rgba(39,174,96,.35);
            transition: transform .15s, box-shadow .15s;
        }
        .btn-start-big:active { transform: scale(.97); box-shadow: 0 4px 12px rgba(39,174,96,.3); }

        /* Idle student list (attendance before trip) */
        .idle-list { width: 100%; max-width: 360px; }
        .idle-list-title {
            font-size: 0.85em; font-weight: 700; color: var(--muted);
            text-transform: uppercase; letter-spacing: .05em;
            margin: 0 0 10px; padding: 0 4px;
        }

        /* Phase 2: in-trip */
        #phase-trip { padding: 0; }

        .trip-header {
            background: var(--card); padding: 14px 16px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border);
        }
        .trip-count { font-weight: 700; font-size: 1em; }
        .trip-speed { font-size: 1.4em; font-weight: 800; color: var(--green); }
        .trip-speed span { font-size: 0.55em; font-weight: 500; color: var(--muted); }

        .student-list { padding: 12px; flex: 1; overflow-y: auto; }

        .student-card {
            background: var(--card); border-radius: 16px;
            margin-bottom: 10px; overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,.06);
            display: flex; align-items: stretch;
            border-right: 5px solid var(--border);
            transition: border-color .25s;
        }
        .student-card.boarded  { border-right-color: var(--green); }
        .student-card.missing  { border-right-color: var(--orange); }

        .student-info {
            flex: 1; padding: 18px 16px;
            display: flex; flex-direction: column; justify-content: center;
        }
        .student-name  { font-size: 1.1em; font-weight: 700; }
        .student-badge {
            display: inline-block; margin-top: 4px;
            padding: 3px 10px; border-radius: 20px; font-size: 0.75em; font-weight: 600;
        }
        .badge-boarded { background: #e8f8f0; color: var(--green); }
        .badge-waiting  { background: #fef9e7; color: var(--orange); }

        .student-toggle {
            border: none; cursor: pointer;
            min-width: 80px; padding: 0 16px;
            font-family: 'Tajawal', sans-serif;
            font-size: 0.9em; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            transition: background .2s;
        }
        .toggle-board { background: #e8f8f0; color: var(--green); }
        .toggle-board:active { background: #d0f0e0; }
        .toggle-drop  { background: #fdecea; color: var(--red); }
        .toggle-drop:active  { background: #fad7d7; }

        .trip-actions {
            padding: 12px 16px;
            background: var(--card); border-top: 1px solid var(--border);
            display: flex; gap: 10px;
        }
        .btn-stop-big {
            flex: 1; padding: 18px; background: var(--red); color: #fff;
            border: none; border-radius: 14px;
            font-family: 'Tajawal', sans-serif; font-size: 1.15em; font-weight: 800;
            cursor: pointer; box-shadow: 0 4px 14px rgba(231,76,60,.3);
            transition: transform .15s;
        }
        .btn-stop-big:active { transform: scale(.97); }
        .btn-route {
            padding: 18px 20px; background: var(--blue); color: #fff;
            border: none; border-radius: 14px;
            font-family: 'Tajawal', sans-serif; font-size: 1em; font-weight: 700;
            cursor: pointer;
        }

        /* ── MAP SHEET (slide up) ── */
        .map-sheet-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,.5); z-index: 200;
            align-items: flex-end;
        }
        .map-sheet-overlay.open { display: flex; }
        .map-sheet {
            background: var(--card); width: 100%; border-radius: 20px 20px 0 0;
            padding: 16px;
        }
        .map-sheet-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;
        }
        .map-sheet-header h3 { margin: 0; font-size: 1em; }
        .map-close {
            background: var(--border); border: none; width: 32px; height: 32px;
            border-radius: 50%; cursor: pointer; font-size: 1em;
        }
        #map { height: 280px; border-radius: 14px; }
        .route-result {
            margin-top: 12px; font-size: 0.85em; color: var(--muted);
            max-height: 120px; overflow-y: auto;
        }
        .route-stop { padding: 6px 0; border-bottom: 1px solid var(--border); }

        /* ── CAMERA SHEET ── */
        .camera-sheet-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,.7); z-index: 200;
            align-items: flex-end;
        }
        .camera-sheet-overlay.open { display: flex; }
        .camera-sheet {
            background: #000; width: 100%; border-radius: 20px 20px 0 0; padding: 16px;
        }
        .camera-sheet-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;
        }
        .camera-sheet-header h3 { margin: 0; color: #fff; font-size: 1em; }
        #camera-preview { width: 100%; border-radius: 14px; background: #111; display: block; }
        #canvas-capture { display: none; }
        .camera-controls { display: flex; gap: 10px; margin-top: 12px; }
        .cam-btn {
            flex: 1; padding: 14px; border: none; border-radius: 12px;
            font-family: 'Tajawal', sans-serif; font-size: 0.95em; font-weight: 700;
            cursor: pointer;
        }
        .cam-btn-start  { background: var(--red);    color: #fff; }
        .cam-btn-flip   { background: #444;          color: #fff; }
        .cam-btn-close  { background: #555;          color: #fff; flex: 0; padding: 14px 18px; }

        /* ── MODAL ── */
        .modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,.7); z-index: 300;
            justify-content: center; align-items: center; padding: 20px;
        }
        .modal-overlay.open { display: flex; }
        .modal-card {
            background: var(--card); border-radius: 24px;
            padding: 32px 24px; width: 100%; max-width: 360px; text-align: center;
            box-shadow: 0 16px 48px rgba(0,0,0,.3);
        }
        .modal-icon  { font-size: 3.5em; margin-bottom: 12px; }
        .modal-title { font-size: 1.2em; font-weight: 800; color: var(--red); margin-bottom: 8px; }
        .modal-msg   { color: var(--muted); font-size: 0.95em; margin-bottom: 16px; }
        .missing-list {
            background: #fdecea; border-radius: 12px; padding: 12px 16px;
            text-align: right; max-height: 160px; overflow-y: auto; margin-bottom: 20px;
        }
        .missing-student { padding: 8px 0; border-bottom: 1px solid #f5c6c2; color: var(--red); font-weight: 600; }
        .missing-student:last-child { border-bottom: none; }
        .modal-buttons { display: flex; flex-direction: column; gap: 10px; }
        .modal-btn {
            padding: 16px; border: none; border-radius: 14px;
            font-family: 'Tajawal', sans-serif; font-size: 1em; font-weight: 700;
            cursor: pointer;
        }
        .modal-btn-force  { background: var(--green);  color: #fff; }
        .modal-btn-recheck{ background: var(--border); color: var(--text); }
    </style>
</head>
<body>

<!-- ── HEADER ── -->
<header class="header">
    <div>
        <div class="header-title">🚌 <span id="h-plate">{{ plate_number }}</span></div>
        <div class="header-sub" id="h-sub">لوحة السائق</div>
    </div>
    <div class="header-actions">
        <div class="gps-pill">
            <div class="gps-dot" id="gps-dot"></div>
            <span id="speed-val">0</span> <span id="h-kmh">كم/س</span>
        </div>
        <button class="icon-btn" id="cam-icon-btn" onclick="openCameraSheet()" title="Camera">📹</button>
        <button class="icon-btn" onclick="toggleLang()" id="lang-btn" title="Language">EN</button>
        <a href="/logout" class="icon-btn" title="Logout" style="text-decoration:none;">🚪</a>
    </div>
</header>

<!-- ════════════════════ PHASE 1: IDLE ════════════════════ -->
<section class="phase active" id="phase-idle">

    <div class="bus-badge">
        <div class="bus-icon">🚌</div>
        <h2>{{ plate_number }}</h2>
        <p id="idle-ready">جاهز للرحلة</p>
    </div>

    <div class="idle-list">
        <p class="idle-list-title" id="idle-list-title">قائمة الطلاب — سجّل الحضور قبل البدء</p>
        <div id="idle-student-container">
            <p style="text-align:center; color:var(--muted); padding:16px;" id="idle-loading">جاري التحميل...</p>
        </div>
    </div>

    <button class="btn-start-big" onclick="startTrip()" id="btn-start">
        🟢 <span id="start-label">بدء الرحلة</span>
    </button>

</section>

<!-- ════════════════════ PHASE 2: IN-TRIP ════════════════════ -->
<section class="phase" id="phase-trip">

    <div class="trip-header">
        <div class="trip-count" id="trip-count">0 / 0 <span id="trip-count-label" style="font-weight:400; color:var(--muted); font-size:.85em;">صعدوا</span></div>
        <div class="trip-speed"><span id="trip-speed">0</span> <span id="trip-kmh">كم/س</span></div>
    </div>

    <div class="student-list" id="trip-student-container">
        <!-- populated by JS -->
    </div>

    <div class="trip-actions">
        <button class="btn-route" onclick="openRouteSheet()" id="btn-route" title="Route">🗺️</button>
        <button class="btn-stop-big" onclick="stopTrip()" id="btn-stop">
            🔴 <span id="stop-label">إنهاء الرحلة</span>
        </button>
    </div>

</section>

<!-- ════════════════════ MAP SHEET ════════════════════ -->
<div class="map-sheet-overlay" id="map-sheet-overlay" onclick="closeRouteSheet(event)">
    <div class="map-sheet">
        <div class="map-sheet-header">
            <h3 id="route-title">🗺️ المسار الأمثل</h3>
            <button class="map-close" onclick="closeRouteSheet()">✕</button>
        </div>
        <div id="map"></div>
        <div class="route-result" id="route-result"></div>
        <button onclick="optimizeRoute()" id="btn-optimize"
            style="width:100%;margin-top:12px;padding:14px;background:var(--blue);color:#fff;border:none;border-radius:12px;font-family:'Tajawal',sans-serif;font-weight:700;font-size:1em;cursor:pointer;">
            <span id="optimize-label">احسب المسار الأسرع</span>
        </button>
    </div>
</div>

<!-- ════════════════════ CAMERA SHEET ════════════════════ -->
<div class="camera-sheet-overlay" id="camera-sheet-overlay">
    <div class="camera-sheet">
        <div class="camera-sheet-header">
            <h3 id="cam-title">📹 البث المباشر</h3>
            <button class="cam-btn cam-btn-close" onclick="closeCameraSheet()">✕</button>
        </div>
        <video id="camera-preview" autoplay playsinline muted></video>
        <canvas id="canvas-capture"></canvas>
        <div class="camera-controls">
            <button class="cam-btn cam-btn-start" id="cam-toggle-btn" onclick="toggleCamera()">
                <span id="cam-toggle-label">▶ بدء البث</span>
            </button>
            <button class="cam-btn cam-btn-flip" id="cam-flip-btn" onclick="flipCamera()" style="display:none;">
                🔄
            </button>
        </div>
    </div>
</div>

<!-- ════════════════════ ATTENDANCE MODAL ════════════════════ -->
<div class="modal-overlay" id="attendance-modal" role="dialog" aria-modal="true">
    <div class="modal-card">
        <div class="modal-icon">⚠️</div>
        <div class="modal-title" id="modal-title">طلاب لم يصعدوا!</div>
        <div class="modal-msg"   id="modal-msg">الطلاب التالية أسماؤهم لم يُسجَّل صعودهم:</div>
        <div class="missing-list" id="missing-students-list"></div>
        <div class="modal-buttons">
            <button class="modal-btn modal-btn-force" onclick="forceStartTrip()" id="modal-force">
                ▶️ بدء الرحلة على أي حال
            </button>
            <button class="modal-btn modal-btn-recheck" onclick="recheckAttendance()" id="modal-recheck">
                🔄 إعادة الفحص
            </button>
        </div>
    </div>
</div>

<script>
    // ── CONSTANTS ──────────────────────────────────────────────────────────────
    const socket = io();
    const busId  = "{{ bus_id }}";

    let watchId       = null;
    let _allStudents  = [];
    let _routeActive  = false;
    let _driverLat    = null;
    let _driverLng    = null;

    // Camera
    let cameraStream  = null;
    let frameInterval = null;
    let isStreaming   = false;
    let useFrontCamera = false;
    const FRAME_RATE    = 10;
    const FRAME_QUALITY = 0.6;

    // ── LANGUAGE ───────────────────────────────────────────────────────────────
    const LANG = {
        ar: {
            sub: 'لوحة السائق',
            kmh: 'كم/س',
            idleReady: 'جاهز للرحلة',
            idleListTitle: 'قائمة الطلاب — سجّل الحضور قبل البدء',
            startLabel: 'بدء الرحلة',
            stopLabel: 'إنهاء الرحلة',
            tripCountLabel: 'صعدوا',
            tripKmh: 'كم/س',
            routeTitle: '🗺️ المسار الأمثل',
            optimizeLabel: 'احسب المسار الأسرع',
            optimizingLabel: 'جاري الحساب...',
            camTitle: '📹 البث المباشر',
            camStart: '▶ بدء البث',
            camStop: '■ إيقاف البث',
            board: 'صعود',
            drop: 'إنزال',
            boarded: '✅ على المتن',
            waiting: '⏳ ينتظر',
            noStudents: 'لا يوجد طلاب مسجلون في هذه الرحلة',
            loading: 'جاري التحميل...',
            errLoad: 'تعذّر تحميل قائمة الطلاب. تحقّق من الاتصال.',
            modalTitle: 'طلاب لم يصعدوا!',
            modalMsg: 'الطلاب التالية أسماؤهم لم يُسجَّل صعودهم:',
            modalForce: '▶️ بدء الرحلة على أي حال',
            modalRecheck: '🔄 إعادة الفحص',
            routeEmpty: 'لا يوجد طلاب على متن الحافلة حالياً.',
            routeStop: 'توقف',
            gpsWait: 'GPS…',
            gpsActive: 'GPS يبث',
            gpsOff: 'GPS متوقف',
            gpsError: 'GPS خطأ',
        },
        en: {
            sub: 'Driver Dashboard',
            kmh: 'km/h',
            idleReady: 'Ready for trip',
            idleListTitle: 'Students — check attendance before starting',
            startLabel: 'Start Trip',
            stopLabel: 'End Trip',
            tripCountLabel: 'on board',
            tripKmh: 'km/h',
            routeTitle: '🗺️ Optimal Route',
            optimizeLabel: 'Calculate Route',
            optimizingLabel: 'Calculating...',
            camTitle: '📹 Live Camera',
            camStart: '▶ Start Stream',
            camStop: '■ Stop Stream',
            board: 'Board',
            drop: 'Drop',
            boarded: '✅ On board',
            waiting: '⏳ Waiting',
            noStudents: 'No students assigned to this trip',
            loading: 'Loading...',
            errLoad: 'Failed to load students. Check connection.',
            modalTitle: 'Students not boarded!',
            modalMsg: 'The following students have not been marked as boarded:',
            modalForce: '▶️ Start Trip Anyway',
            modalRecheck: '🔄 Recheck',
            routeEmpty: 'No students are currently on the bus.',
            routeStop: 'Stop',
            gpsWait: 'GPS…',
            gpsActive: 'GPS live',
            gpsOff: 'GPS off',
            gpsError: 'GPS error',
        }
    };
    let lang = localStorage.getItem('driver_lang') || 'ar';

    function t(key) { return LANG[lang][key] || key; }

    function applyLang() {
        document.documentElement.lang = lang;
        document.documentElement.dir  = lang === 'ar' ? 'rtl' : 'ltr';
        document.getElementById('lang-btn').innerText     = lang === 'ar' ? 'EN' : 'ع';
        document.getElementById('h-sub').innerText        = t('sub');
        document.getElementById('h-kmh').innerText        = t('kmh');
        document.getElementById('idle-ready').innerText   = t('idleReady');
        document.getElementById('idle-list-title').innerText = t('idleListTitle');
        document.getElementById('start-label').innerText  = t('startLabel');
        document.getElementById('stop-label').innerText   = t('stopLabel');
        document.getElementById('trip-count-label').innerText = t('tripCountLabel');
        document.getElementById('trip-kmh').innerText     = t('tripKmh');
        document.getElementById('route-title').innerText  = t('routeTitle');
        document.getElementById('optimize-label').innerText = t('optimizeLabel');
        document.getElementById('cam-title').innerText    = t('camTitle');
        document.getElementById('cam-toggle-label').innerText = isStreaming ? t('camStop') : t('camStart');
        document.getElementById('modal-title').innerText  = t('modalTitle');
        document.getElementById('modal-msg').innerText    = t('modalMsg');
        document.getElementById('modal-force').innerText  = t('modalForce');
        document.getElementById('modal-recheck').innerText = t('modalRecheck');
        // Re-render student lists
        renderIdleList();
        renderTripList();
    }

    function toggleLang() {
        lang = lang === 'ar' ? 'en' : 'ar';
        localStorage.setItem('driver_lang', lang);
        applyLang();
    }

    // ── HELPERS ────────────────────────────────────────────────────────────────
    function escapeHtml(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
            ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function setGps(state, speed) {
        const dot  = document.getElementById('gps-dot');
        const spd1 = document.getElementById('speed-val');
        const spd2 = document.getElementById('trip-speed');
        dot.className = 'gps-dot ' + (state === 'active' ? 'active' : state === 'error' ? 'error' : '');
        if (speed !== undefined) { spd1.innerText = speed; spd2.innerText = speed; }
    }

    function updateTripCounter() {
        const boarded = _allStudents.filter(s => s.status === 'BOARDED').length;
        document.getElementById('trip-count').innerHTML =
            `${boarded} / ${_allStudents.length} <span id="trip-count-label" style="font-weight:400;color:var(--muted);font-size:.85em;">${t('tripCountLabel')}</span>`;
    }

    // ── DATA ───────────────────────────────────────────────────────────────────
    function loadManifest() {
        fetch('/api/driver/manifest')
            .then(r => r.json())
            .then(students => {
                _allStudents = students;
                renderIdleList();
                renderTripList();
                updateTripCounter();
            })
            .catch(() => {
                document.getElementById('idle-student-container').innerHTML =
                    `<p style="text-align:center;color:var(--red);padding:16px;">${t('errLoad')}</p>`;
            });
    }

    function renderIdleList() {
        const c = document.getElementById('idle-student-container');
        if (!_allStudents.length) {
            c.innerHTML = `<p style="text-align:center;color:var(--muted);padding:16px;">${t('noStudents')}</p>`;
            return;
        }
        c.innerHTML = _allStudents.map(s => {
            const boarded  = s.status === 'BOARDED';
            const badgeCls = boarded ? 'badge-boarded' : 'badge-waiting';
            const badge    = boarded ? t('boarded') : t('waiting');
            const btnCls   = boarded ? 'toggle-drop' : 'toggle-board';
            const btnTxt   = boarded ? t('drop') : t('board');
            return `
            <div class="student-card ${boarded ? 'boarded' : 'missing'}" id="idle-card-${escapeHtml(s.id)}">
                <div class="student-info">
                    <div class="student-name">${escapeHtml(s.name)}</div>
                    <span class="student-badge ${badgeCls}">${badge}</span>
                </div>
                <button class="student-toggle ${btnCls}"
                        onclick="toggleStudent('${escapeHtml(s.id)}')">${btnTxt}</button>
            </div>`;
        }).join('');
    }

    function renderTripList() {
        const c = document.getElementById('trip-student-container');
        if (!_allStudents.length) {
            c.innerHTML = `<p style="text-align:center;color:var(--muted);padding:24px;">${t('noStudents')}</p>`;
            return;
        }
        c.innerHTML = _allStudents.map(s => {
            const boarded  = s.status === 'BOARDED';
            const badgeCls = boarded ? 'badge-boarded' : 'badge-waiting';
            const badge    = boarded ? t('boarded') : t('waiting');
            const btnCls   = boarded ? 'toggle-drop' : 'toggle-board';
            const btnTxt   = boarded ? t('drop') : t('board');
            return `
            <div class="student-card ${boarded ? 'boarded' : 'missing'}" id="trip-card-${escapeHtml(s.id)}">
                <div class="student-info">
                    <div class="student-name">${escapeHtml(s.name)}</div>
                    <span class="student-badge ${badgeCls}">${badge}</span>
                </div>
                <button class="student-toggle ${btnCls}"
                        onclick="toggleStudent('${escapeHtml(s.id)}')">${btnTxt}</button>
            </div>`;
        }).join('');
    }

    // ── ATTENDANCE ─────────────────────────────────────────────────────────────
    function toggleStudent(studentId) {
        const s = _allStudents.find(x => x.id == studentId);
        if (!s) return;
        const nowBoarding = s.status !== 'BOARDED';
        s.status = nowBoarding ? 'BOARDED' : 'DROPPED';

        socket.emit('manual_attendance', {
            student_id: studentId,
            status: s.status,
            bus_id: busId
        });

        if (!nowBoarding && _routeActive) setTimeout(() => _calcRoute(true), 3000);

        // Optimistic UI update on both lists
        renderIdleList();
        renderTripList();
        updateTripCounter();
    }

    // ── TRIP CONTROL ───────────────────────────────────────────────────────────
    function startTrip() {
        if (!navigator.geolocation) return alert(lang === 'ar' ? 'GPS غير مدعوم' : 'GPS not supported');
        fetch('/api/driver/manifest')
            .then(r => r.json())
            .then(students => {
                _allStudents = students;
                const missing = students.filter(s => s.status !== 'BOARDED');
                if (missing.length) {
                    document.getElementById('missing-students-list').innerHTML =
                        missing.map(s => `<div class="missing-student">❌ ${escapeHtml(s.name)}</div>`).join('');
                    document.getElementById('attendance-modal').classList.add('open');
                } else {
                    actuallyStartTrip();
                }
            })
            .catch(() => actuallyStartTrip());
    }

    function recheckAttendance() {
        document.getElementById('attendance-modal').classList.remove('open');
        loadManifest();
    }

    function forceStartTrip() {
        document.getElementById('attendance-modal').classList.remove('open');
        actuallyStartTrip();
    }

    function actuallyStartTrip() {
        _routeActive = true;
        document.getElementById('phase-idle').classList.remove('active');
        document.getElementById('phase-trip').classList.add('active');

        watchId = navigator.geolocation.watchPosition(
            pos => {
                _driverLat = pos.coords.latitude;
                _driverLng = pos.coords.longitude;
                const speed = Math.round((pos.coords.speed || 0) * 3.6);
                setGps('active', speed);

                if (routeMap) {
                    if (busMarker) busMarker.setLatLng([_driverLat, _driverLng]);
                    else {
                        busMarker = L.marker([_driverLat, _driverLng], {
                            icon: L.divIcon({ html: '🚌', className: '', iconSize: [30,30] })
                        }).addTo(routeMap).bindPopup('موقعك الحالي');
                        routeMap.panTo([_driverLat, _driverLng]);
                    }
                }

                socket.emit('driver_gps_update', {
                    bus_id: busId, lat: _driverLat, lng: _driverLng, speed
                });
            },
            err => setGps('error'),
            { enableHighAccuracy: true, timeout: 5000 }
        );
    }

    function stopTrip() {
        if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
        _routeActive = false;
        setGps('', 0);
        if (isStreaming) stopCamera();
        document.getElementById('phase-trip').classList.remove('active');
        document.getElementById('phase-idle').classList.add('active');
        loadManifest();
    }

    // ── MAP / ROUTE ────────────────────────────────────────────────────────────
    let routeMap = null, routeLayer = null, busMarker = null;

    function openRouteSheet() {
        document.getElementById('map-sheet-overlay').classList.add('open');
        if (!routeMap) {
            routeMap = L.map('map').setView([21.543333, 39.172778], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(routeMap);
        }
        setTimeout(() => routeMap.invalidateSize(), 100);
    }

    function closeRouteSheet(e) {
        if (e && e.target !== document.getElementById('map-sheet-overlay')) return;
        document.getElementById('map-sheet-overlay').classList.remove('open');
    }

    function optimizeRoute() { _calcRoute(false); }

    function _calcRoute(silent) {
        const btn = document.getElementById('btn-optimize');
        if (!silent) { btn.querySelector('span').innerText = t('optimizingLabel'); btn.disabled = true; }

        const doFetch = (lat, lng) => {
            fetch(`/api/optimize_route/${busId}?lat=${lat}&lng=${lng}`)
                .then(r => r.json())
                .then(data => {
                    if (!silent) { btn.querySelector('span').innerText = t('optimizeLabel'); btn.disabled = false; }
                    if (data.status === 'empty') {
                        if (!silent) document.getElementById('route-result').innerText = t('routeEmpty');
                        return;
                    }
                    if (data.stops) {
                        // Draw on map
                        if (routeLayer) routeMap.removeLayer(routeLayer);
                        const latlngs = [[lat, lng], ...data.stops.map(s => [s.lat, s.lng])];
                        routeLayer = L.polyline(latlngs, { color:'#2980b9', weight:4 }).addTo(routeMap);
                        routeMap.fitBounds(routeLayer.getBounds(), { padding:[20,20] });
                        data.stops.forEach((s, i) =>
                            L.marker([s.lat, s.lng]).addTo(routeMap)
                                .bindPopup(`${i+1}. ${s.name}`)
                        );
                        document.getElementById('route-result').innerHTML =
                            data.stops.map((s,i) =>
                                `<div class="route-stop">${i+1}. ${escapeHtml(s.name)}</div>`
                            ).join('');
                    }
                })
                .catch(() => {
                    if (!silent) { btn.querySelector('span').innerText = t('optimizeLabel'); btn.disabled = false; }
                });
        };

        if (_driverLat && _driverLng) { doFetch(_driverLat, _driverLng); return; }
        navigator.geolocation.getCurrentPosition(
            pos => doFetch(pos.coords.latitude, pos.coords.longitude),
            () => { if (!silent) { btn.querySelector('span').innerText = t('optimizeLabel'); btn.disabled = false; } },
            { enableHighAccuracy: true, timeout: 5000 }
        );
    }

    // ── CAMERA ─────────────────────────────────────────────────────────────────
    function openCameraSheet()  { document.getElementById('camera-sheet-overlay').classList.add('open'); }
    function closeCameraSheet() { document.getElementById('camera-sheet-overlay').classList.remove('open'); }

    async function toggleCamera() {
        isStreaming ? stopCamera() : await startCamera();
    }

    async function startCamera() {
        try {
            cameraStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: useFrontCamera ? 'user' : 'environment', width:{ideal:640}, height:{ideal:480} },
                audio: false
            });
            const video = document.getElementById('camera-preview');
            video.srcObject = cameraStream;
            await video.play();
            isStreaming = true;
            document.getElementById('cam-icon-btn').classList.add('cam-live');
            document.getElementById('cam-toggle-label').innerText = t('camStop');
            document.getElementById('cam-flip-btn').style.display = '';
            socket.emit('camera_stream_start', { bus_id: busId });
            startFrameCapture();
        } catch (err) {
            alert((lang==='ar'?'خطأ في الكاميرا: ':'Camera error: ') + err.message);
        }
    }

    function stopCamera() {
        if (frameInterval) { clearInterval(frameInterval); frameInterval = null; }
        if (cameraStream)  { cameraStream.getTracks().forEach(t => t.stop()); cameraStream = null; }
        const video = document.getElementById('camera-preview');
        video.srcObject = null;
        isStreaming = false;
        document.getElementById('cam-icon-btn').classList.remove('cam-live');
        document.getElementById('cam-toggle-label').innerText = t('camStart');
        document.getElementById('cam-flip-btn').style.display = 'none';
        socket.emit('camera_stream_stop', { bus_id: busId });
    }

    function startFrameCapture() {
        const video  = document.getElementById('camera-preview');
        const canvas = document.getElementById('canvas-capture');
        const ctx    = canvas.getContext('2d');
        canvas.width  = video.videoWidth  || 640;
        canvas.height = video.videoHeight || 480;
        frameInterval = setInterval(() => {
            if (!isStreaming || !video.videoWidth) return;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            socket.emit('camera_frame', {
                bus_id: busId, frame: canvas.toDataURL('image/jpeg', FRAME_QUALITY), timestamp: Date.now()
            });
        }, 1000 / FRAME_RATE);
    }

    async function flipCamera() {
        if (!isStreaming) return;
        useFrontCamera = !useFrontCamera;
        if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
        if (frameInterval) { clearInterval(frameInterval); frameInterval = null; }
        try {
            cameraStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: useFrontCamera ? 'user' : 'environment', width:{ideal:640}, height:{ideal:480} },
                audio: false
            });
            const video = document.getElementById('camera-preview');
            video.srcObject = cameraStream;
            await video.play();
            startFrameCapture();
        } catch (err) {
            useFrontCamera = !useFrontCamera;
            await startCamera();
        }
    }

    // ── INIT ───────────────────────────────────────────────────────────────────
    applyLang();
    loadManifest();
</script>
</body>
</html>
