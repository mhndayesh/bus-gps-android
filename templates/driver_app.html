<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <title>آمن مدرستي - لوحة السائق</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root {
            --sage-green: #9FB8AD;
            --sage-dark: #7A9A8D;
            --gold: #F5C518;
            --gold-dark: #D4A914;
            --black: #1A1A1A;
            --cream: #F5F5F0;
            --white: #FFFFFF;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            margin: 0;
            background: var(--black);
            color: var(--cream);
        }

        .header {
            padding: 20px;
            background: linear-gradient(135deg, var(--black) 0%, #2d2d2d 100%);
            text-align: center;
            border-bottom: 3px solid var(--gold);
        }

        .header h2 {
            margin: 0;
            color: var(--gold);
        }

        .header small {
            color: var(--sage-green);
        }

        .status-box {
            padding: 20px;
            text-align: center;
            background: rgba(159, 184, 173, 0.1);
            margin: 15px;
            border-radius: 15px;
            border: 2px solid var(--sage-dark);
        }

        #gps-status {
            color: var(--gold);
            font-weight: bold;
            font-size: 1.1em;
        }

        #speed-display {
            font-size: 2.5em;
            color: var(--cream);
            font-weight: bold;
            margin-top: 10px;
        }

        .speed-label {
            font-size: 0.9em;
            color: var(--sage-green);
        }

        /* Big Buttons for Driver Safety */
        .big-btn {
            width: 90%;
            padding: 20px;
            font-size: 18px;
            border: none;
            border-radius: 15px;
            margin: 8px auto;
            display: block;
            cursor: pointer;
            font-weight: bold;
            font-family: 'Tajawal', sans-serif;
            transition: all 0.3s ease;
        }

        .big-btn:hover {
            transform: scale(1.02);
        }

        .btn-start {
            background: var(--gold);
            color: var(--black);
        }

        .btn-stop {
            background: #c0392b;
            color: white;
            display: none;
        }

        .btn-camera {
            background: #9b59b6;
            color: white;
        }

        .btn-camera.streaming {
            background: #e74c3c;
            animation: pulse 1.5s infinite;
        }

        .btn-flip {
            background: #3498db;
            color: white;
            display: none;
        }

        .btn-flip.visible {
            display: block;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.7;
            }
        }

        /* Camera Preview */
        .camera-container {
            display: none;
            margin: 15px;
            border-radius: 15px;
            overflow: hidden;
            border: 3px solid var(--gold);
            position: relative;
        }

        .camera-container.active {
            display: block;
        }

        #camera-preview {
            width: 100%;
            height: auto;
            display: block;
            background: #000;
        }

        .camera-status {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(231, 76, 60, 0.9);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            animation: blink 1s infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }

        #canvas-capture {
            display: none;
        }

        /* Attendance List Styles */
        .student-list {
            padding: 15px;
        }

        .section-title {
            color: var(--gold);
            text-align: center;
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .student-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--cream);
            color: var(--black);
            padding: 15px 20px;
            margin-bottom: 10px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .student-row span {
            font-weight: 500;
        }

        .toggle-btn {
            padding: 12px 20px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            font-family: 'Tajawal', sans-serif;
            transition: all 0.3s ease;
        }

        .btn-board {
            background: var(--sage-dark);
            color: var(--white);
        }

        .btn-board:hover {
            background: var(--black);
        }

        .btn-drop {
            background: var(--gold);
            color: var(--black);
        }

        .btn-drop:hover {
            background: var(--gold-dark);
        }

        .logout-link {
            display: block;
            text-align: center;
            padding: 15px;
            color: var(--sage-green);
            text-decoration: none;
            font-size: 0.9em;
        }

        .logout-link:hover {
            color: #c0392b;
        }

        .no-students {
            text-align: center;
            color: var(--sage-green);
            padding: 20px;
        }

        /* Attendance Alert Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--cream);
            color: var(--black);
            padding: 30px;
            border-radius: 20px;
            max-width: 90%;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            border: 3px solid var(--gold);
        }

        .modal-icon {
            font-size: 4em;
            margin-bottom: 15px;
        }

        .modal-title {
            font-size: 1.4em;
            font-weight: bold;
            color: #c0392b;
            margin-bottom: 10px;
        }

        .modal-message {
            font-size: 1.1em;
            margin-bottom: 20px;
            color: var(--black);
        }

        .missing-list {
            background: rgba(192, 57, 43, 0.1);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: right;
            max-height: 150px;
            overflow-y: auto;
        }

        .missing-student {
            padding: 8px;
            border-bottom: 1px solid rgba(192, 57, 43, 0.2);
            color: #c0392b;
            font-weight: 500;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .modal-btn {
            padding: 15px 25px;
            border: none;
            border-radius: 12px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Tajawal', sans-serif;
            transition: all 0.3s ease;
        }

        .modal-btn-start {
            background: var(--gold);
            color: var(--black);
        }

        .modal-btn-recheck {
            background: var(--sage-dark);
            color: white;
        }
    </style>
</head>

<body>

    <div class="header">
        <h2>🚌 الحافلة {{ plate_number }}</h2>
        <small>(رقم النظام: {{ bus_id }})</small>
    </div>

    <div class="status-box">
        <div id="gps-status">GPS: في الانتظار...</div>
        <div id="speed-display">0</div>
        <div class="speed-label">كم/ساعة</div>
    </div>

    <button class="big-btn btn-start" onclick="startTrip()">🟢 بدء الرحلة</button>
    <button class="big-btn btn-stop" onclick="stopTrip()">🔴 إنهاء الرحلة</button>

    <!-- Optimization Button -->
    <button class="big-btn" style="background: #3498db; color: white;" onclick="optimizeRoute()">
        🗺️ احسب المسار الأسرع
    </button>

    <!-- Map Container -->
    <div id="map"
        style="height: 300px; margin: 15px; border-radius: 15px; border: 2px solid var(--gold); display:none;"></div>

    <!-- Camera Streaming Button -->
    <button class="big-btn btn-camera" id="camera-btn" onclick="toggleCamera()">
        📹 بدء البث المباشر
    </button>

    <!-- Camera Flip Button -->
    <button class="big-btn btn-flip" id="flip-btn" onclick="flipCamera()">
        🔄 تبديل الكاميرا (أمامية/خلفية)
    </button>

    <!-- Camera Preview -->
    <div class="camera-container" id="camera-container">
        <video id="camera-preview" autoplay playsinline muted></video>
        <canvas id="canvas-capture"></canvas>
        <div class="camera-status">
            <span class="live-dot"></span>
            <span>LIVE</span>
        </div>
    </div>

    <div class="student-list" id="student-container">
        <h3 class="section-title">📋 قائمة الطلاب</h3>
        <p class="no-students">سيظهر الطلاب هنا...</p>
    </div>

    <!-- Attendance Warning Modal -->
    <div class="modal-overlay" id="attendance-modal">
        <div class="modal-content">
            <div class="modal-icon">⚠️</div>
            <div class="modal-title">تنبيه: طلاب غير موجودين!</div>
            <div class="modal-message">الطلاب التالية أسماؤهم لم يصعدوا بعد:</div>
            <div class="missing-list" id="missing-students-list"></div>
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-recheck" onclick="recheckAttendance()">
                    🔄 إعادة الفحص
                </button>
                <button class="modal-btn modal-btn-start" onclick="forceStartTrip()">
                    ▶️ بدء الرحلة على أي حال
                </button>
            </div>
        </div>
    </div>

    <a href="/logout" class="logout-link">← تسجيل الخروج</a>

    <script>
        const socket = io();
        let watchId = null;
        const busId = "{{ bus_id }}";

        // Camera variables
        let cameraStream = null;
        let frameInterval = null;
        let isStreaming = false;
        let useFrontCamera = false; // false = back camera, true = front camera
        const FRAME_RATE = 10; // 10 FPS (100ms interval) - smooth streaming
        const FRAME_QUALITY = 0.6; // JPEG quality (0.6 = 60%)

        // --- LOAD MANIFEST ---
        function loadManifest() {
            fetch('/api/driver/manifest')
                .then(res => res.json())
                .then(students => {
                    const container = document.getElementById('student-container');
                    if (students.length === 0) {
                        container.innerHTML = '<h3 class="section-title">📋 قائمة الطلاب</h3><p class="no-students">لا يوجد طلاب مسجلين في هذه الرحلة</p>';
                        return;
                    }

                    let html = '<h3 class="section-title">📋 قائمة الطلاب</h3>';
                    students.forEach(s => {
                        const isBoarded = s.status === 'BOARDED';
                        const btnClass = isBoarded ? "btn-drop" : "btn-board";
                        const btnText = isBoarded ? "إنزال" : "صعود";

                        html += `
                        <div class="student-row">
                            <span>${s.name}</span>
                            <button class="toggle-btn ${btnClass}" onclick="toggleStudent(this, '${s.id}')">
                                ${btnText}
                            </button>
                        </div>`;
                    });
                    container.innerHTML = html;
                });
        }

        loadManifest();

        // --- GPS LOGIC ---
        function startTrip() {
            if (!navigator.geolocation) return alert("GPS غير مدعوم على هذا الجهاز");

            // First check if all students are on board
            fetch('/api/driver/manifest')
                .then(res => res.json())
                .then(students => {
                    const missingStudents = students.filter(s => s.status !== 'BOARDED');

                    if (missingStudents.length > 0) {
                        // Show warning modal
                        const listDiv = document.getElementById('missing-students-list');
                        listDiv.innerHTML = missingStudents.map(s =>
                            `<div class="missing-student">❌ ${s.name}</div>`
                        ).join('');

                        document.getElementById('attendance-modal').style.display = 'flex';
                    } else {
                        // All students boarded, start trip directly
                        actuallyStartTrip();
                    }
                })
                .catch(err => {
                    console.error('Error checking attendance:', err);
                    // On error, just start trip
                    actuallyStartTrip();
                });
        }

        function recheckAttendance() {
            // Reload manifest and close modal
            document.getElementById('attendance-modal').style.display = 'none';
            loadManifest();
        }

        function forceStartTrip() {
            // Close modal and start trip anyway
            document.getElementById('attendance-modal').style.display = 'none';
            actuallyStartTrip();
        }

        function actuallyStartTrip() {
            document.querySelector('.btn-start').style.display = 'none';
            document.querySelector('.btn-stop').style.display = 'block';

            watchId = navigator.geolocation.watchPosition(
                (position) => {
                    const data = {
                        bus_id: busId,
                        lat: position.coords.latitude,
                        lng: position.coords.longitude,
                        speed: Math.round(position.coords.speed * 3.6) || 0
                    };

                    document.getElementById('gps-status').innerText = "GPS: 🟢 يبث الآن";
                    document.getElementById('gps-status').style.color = "#27ae60";
                    document.getElementById('speed-display').innerText = data.speed;

                    socket.emit('driver_gps_update', data);
                },
                (error) => alert("خطأ GPS: " + error.message),
                { enableHighAccuracy: true, timeout: 5000 }
            );
        }

        function stopTrip() {
            navigator.geolocation.clearWatch(watchId);
            document.querySelector('.btn-start').style.display = 'block';
            document.querySelector('.btn-stop').style.display = 'none';
            document.getElementById('gps-status').innerText = "GPS: 🔴 متوقف";
            document.getElementById('gps-status').style.color = "#c0392b";

            // Also stop camera if streaming
            if (isStreaming) {
                stopCamera();
            }
        }

        // --- CAMERA STREAMING LOGIC ---
        async function toggleCamera() {
            if (isStreaming) {
                stopCamera();
            } else {
                await startCamera();
            }
        }

        async function startCamera() {
            const btn = document.getElementById('camera-btn');
            const container = document.getElementById('camera-container');
            const video = document.getElementById('camera-preview');

            try {
                // Request camera access based on current setting
                const facingMode = useFrontCamera ? 'user' : 'environment';
                cameraStream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: facingMode,
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    },
                    audio: false
                });

                video.srcObject = cameraStream;
                await video.play();

                // Update UI
                container.classList.add('active');
                btn.classList.add('streaming');
                btn.innerHTML = '🔴 إيقاف البث';
                isStreaming = true;

                // Show flip button
                document.getElementById('flip-btn').classList.add('visible');

                // Notify server that streaming started
                socket.emit('camera_stream_start', { bus_id: busId });

                // Start capturing and sending frames
                startFrameCapture();

            } catch (error) {
                console.error('Camera error:', error);
                alert('خطأ في تشغيل الكاميرا: ' + error.message);
            }
        }

        function stopCamera() {
            const btn = document.getElementById('camera-btn');
            const container = document.getElementById('camera-container');
            const video = document.getElementById('camera-preview');

            // Stop frame capture
            if (frameInterval) {
                clearInterval(frameInterval);
                frameInterval = null;
            }

            // Stop camera stream
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
                cameraStream = null;
            }

            video.srcObject = null;

            // Update UI
            container.classList.remove('active');
            btn.classList.remove('streaming');
            btn.innerHTML = '📹 بدء البث المباشر';
            isStreaming = false;

            // Hide flip button
            document.getElementById('flip-btn').classList.remove('visible');

            // Notify server that streaming stopped
            socket.emit('camera_stream_stop', { bus_id: busId });
        }

        function startFrameCapture() {
            const video = document.getElementById('camera-preview');
            const canvas = document.getElementById('canvas-capture');
            const ctx = canvas.getContext('2d');

            // Set canvas size to match video
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;

            // Capture frames at specified rate
            frameInterval = setInterval(() => {
                if (!isStreaming || !video.videoWidth) return;

                // Draw video frame to canvas
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                // Convert to JPEG and send
                const frameData = canvas.toDataURL('image/jpeg', FRAME_QUALITY);

                socket.emit('camera_frame', {
                    bus_id: busId,
                    frame: frameData,
                    timestamp: Date.now()
                });

            }, 1000 / FRAME_RATE);
        }

        // --- CAMERA FLIP LOGIC ---
        async function flipCamera() {
            if (!isStreaming) return;

            // Toggle camera direction
            useFrontCamera = !useFrontCamera;

            // Stop current stream
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
            }

            // Stop frame capture temporarily
            if (frameInterval) {
                clearInterval(frameInterval);
                frameInterval = null;
            }

            const video = document.getElementById('camera-preview');

            try {
                // Get new camera
                const facingMode = useFrontCamera ? 'user' : 'environment';
                cameraStream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: facingMode,
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    },
                    audio: false
                });

                video.srcObject = cameraStream;
                await video.play();

                // Update flip button text
                const flipBtn = document.getElementById('flip-btn');
                flipBtn.innerHTML = useFrontCamera ? '🔄 الكاميرا الخلفية' : '🔄 الكاميرا الأمامية';

                // Restart frame capture
                startFrameCapture();

            } catch (error) {
                console.error('Flip camera error:', error);
                alert('خطأ في تبديل الكاميرا: ' + error.message);
                // Try to restart with original camera
                useFrontCamera = !useFrontCamera;
                await startCamera();
            }
        }

        // --- ATTENDANCE LOGIC ---
        function toggleStudent(btn, studentId) {
            const isBoarding = btn.innerText.trim() === "صعود";

            if (isBoarding) {
                btn.innerText = "إنزال";
                btn.className = "toggle-btn btn-drop";
                socket.emit('manual_attendance', { student_id: studentId, status: "BOARDED", bus_id: busId });
            } else {
                btn.innerText = "صعود";
                btn.className = "toggle-btn btn-board";
                socket.emit('manual_attendance', { student_id: studentId, status: "DROPPED", bus_id: busId });
            }
        }

        // --- ROUTE OPTIMIZATION ---
        let routeMap = null;
        let routeLayer = null;

        function optimizeRoute() {
            const btn = document.querySelector('button[onclick="optimizeRoute()"]');
            const mapContainer = document.getElementById('map');

            btn.innerHTML = "⏳ جاري الحساب...";
            btn.disabled = true;

            fetch(`/api/optimize_route/${busId}`)
                .then(res => res.json())
                .then(data => {
                    btn.innerHTML = "🗺️ احسب المسار الأسرع";
                    btn.disabled = false;

                    if (data.status !== 'success') {
                        alert("تعذر حساب المسار: " + (data.message || "خطأ غير معروف"));
                        return;
                    }

                    // Show Map
                    mapContainer.style.display = 'block';

                    // Initialize Map if needed
                    if (!routeMap) {
                        routeMap = L.map('map');
                        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(routeMap);
                    }

                    // Clear previous route
                    if (routeLayer) routeMap.removeLayer(routeLayer);
                    routeMap.eachLayer((layer) => {
                        if (layer instanceof L.Marker) routeMap.removeLayer(layer);
                    });

                    // Decode Geometry (GeoJSON)
                    // The API returns GeoJSON geometry directly
                    if (data.geometry) {
                        routeLayer = L.geoJSON(data.geometry, {
                            style: { color: 'blue', weight: 5 }
                        }).addTo(routeMap);

                        routeMap.fitBounds(routeLayer.getBounds());
                    }

                    // Add Markers
                    data.stops.forEach((stop, index) => {
                        L.marker([stop.lat, stop.lng])
                            .addTo(routeMap)
                            .bindPopup(`<b>${index + 1}. ${stop.name}</b>`);
                    });

                    alert(`✅ تم تحسين المسار! المسافة: ${(data.distance / 1000).toFixed(1)} كم`);
                })
                .catch(err => {
                    console.error(err);
                    btn.innerHTML = "🗺️ احسب المسار الأسرع";
                    btn.disabled = false;
                    alert("خطأ في الاتصال بالسيرفر");
                });
        }

        // Clean up on page unload
        window.addEventListener('beforeunload', () => {
            if (isStreaming) {
                stopCamera();
            }
        });
    </script>
</body>

</html>
