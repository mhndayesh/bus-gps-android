<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <title>آمن مدرستي - School Bus Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js" integrity="sha384-DkkWv9oJFWLIydBXXjkBWnG1/fuVhw8YPBq37uvvD6WSYRFRqr21eY5Dg9ZhmWdy" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --sage-green: #9FB8AD;
            --sage-dark: #7A9A8D;
            --gold: #F5C518;
            --gold-dark: #D4A914;
            --black: #1A1A1A;
            --cream: #F5F5F0;
            --white: #FFFFFF;
        }

        body {
            margin: 0;
            font-family: 'Tajawal', sans-serif;
            background: var(--sage-green);
        }

        #map {
            height: 100vh;
            width: 100%;
        }

        /* The Video Modal (Hidden by default) */
        #video-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(26, 26, 26, 0.9);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        video {
            width: 80%;
            max-width: 800px;
            background: var(--black);
            border: 3px solid var(--gold);
            border-radius: 12px;
        }

        .close-btn {
            background: var(--gold);
            color: var(--black);
            padding: 12px 30px;
            border: none;
            margin-top: 15px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            transition: all 0.3s ease;
            font-family: 'Tajawal', sans-serif;
        }

        .close-btn:hover {
            background: var(--gold-dark);
            transform: scale(1.05);
        }

        /* The Button inside the Map Popup */
        .watch-btn {
            background: var(--gold);
            color: var(--black);
            border: none;
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 20px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .watch-btn:hover {
            background: var(--gold-dark);
        }

        #status-panel {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--cream);
            padding: 20px;
            z-index: 1000;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
            width: 300px;
            border: 3px solid var(--sage-dark);
            text-align: right;
        }

        #status-panel h3 {
            margin: 0 0 15px 0;
            color: var(--black);
            font-size: 1.3em;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
        }

        #bus-list {
            background: var(--white);
            padding: 12px;
            border-radius: 10px;
            color: var(--black);
            font-size: 0.95em;
        }

        .nav-link {
            display: block;
            text-align: center;
            padding: 12px;
            text-decoration: none;
            border-radius: 12px;
            margin-top: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .nav-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .nav-admin {
            background: var(--sage-green);
            color: var(--black);
        }

        .nav-parent {
            background: var(--gold);
            color: var(--black);
        }

        .nav-driver {
            background: var(--black);
            color: var(--cream);
        }

        .nav-school {
            background: #3498db;
            color: white;
        }

        /* Logo styling */
        .logo-container {
            text-align: center;
            margin-bottom: 15px;
        }

        .logo-container img {
            width: 80px;
            height: auto;
        }

        .app-title {
            font-size: 1.3em;
            color: var(--black);
            margin: 5px 0;
            font-weight: bold;
        }

        .app-subtitle {
            font-size: 0.9em;
            color: var(--sage-dark);
        }

        .bilingual {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .ar {
            font-size: 1em;
        }

        .en {
            font-size: 0.8em;
            color: var(--sage-dark);
        }
    </style>
</head>

<body>

    <div id="video-modal" role="dialog" aria-modal="true" aria-label="بث مباشر">
        <h2 style="color: var(--gold);">🎥 بث مباشر: الباص <span id="modal-bus-id">--</span></h2>
        <video id="video-player" controls autoplay></video>
        <button class="close-btn" onclick="closeCamera()">✕ إغلاق البث</button>
    </div>

    <div id="status-panel">
        <div class="logo-container">
            <div style="font-size: 2.5em;">🚌</div>
            <div class="app-title">آمن مدرستي</div>
            <div class="app-subtitle">Safe School Transport</div>
        </div>

        <!-- Tour Link -->
        <a href="/tour"
            style="display:block; text-align:center; padding:10px 15px; background:linear-gradient(135deg, var(--gold), var(--gold-dark)); color:var(--black); text-decoration:none; border-radius:20px; margin-bottom:15px; font-weight:bold; font-size:0.9em; transition:all 0.3s ease;"
            onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
            ✨ اكتشف المزيد | Learn More
        </a>

        <h3>الأسطول المباشر 📍</h3>
        <div id="bus-list">في انتظار الإشارة...</div>
        <hr style="border: none; border-top: 2px solid var(--sage-green); margin: 15px 0;">

        <a href="/admin" class="nav-link nav-admin">
            <span class="bilingual">
                <span class="ar">⚙️ لوحة المشرف العام</span>
                <span class="en">Super Admin</span>
            </span>
        </a>
        <a href="/admin" class="nav-link nav-school">
            <span class="bilingual">
                <span class="ar">🏫 دخول مشرف المدرسة</span>
                <span class="en">School Admin</span>
            </span>
        </a>
        <a href="/parent/login" class="nav-link nav-parent">
            <span class="bilingual">
                <span class="ar">👨‍👩‍👧‍👦 دخول ولي الأمر</span>
                <span class="en">Parent Login</span>
            </span>
        </a>
        <a href="/driver/login" class="nav-link nav-driver">
            <span class="bilingual">
                <span class="ar">🚌 دخول السائق</span>
                <span class="en">Driver Login</span>
            </span>
        </a>
    </div>

    <div id="map"></div>

    <script>
        var map = L.map('map').setView([24.7136, 46.6753], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        var busMarkers = {};
        var socket = io();

        // --- A. The Logic to Open Camera ---
        function openCamera(busId) {
            console.log("Requesting camera for Bus " + busId);

            fetch(`/get_camera/${busId}`)
                .then(response => response.json())
                .then(data => {
                    document.getElementById('video-modal').style.display = 'flex';
                    document.getElementById('modal-bus-id').innerText = busId;

                    var video = document.getElementById('video-player');
                    var streamUrl = data.stream_url;

                    if (Hls.isSupported()) {
                        var hls = new Hls();
                        hls.loadSource(streamUrl);
                        hls.attachMedia(video);
                        hls.on(Hls.Events.MANIFEST_PARSED, function () {
                            video.play();
                        });
                    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                        video.src = streamUrl;
                        video.addEventListener('loadedmetadata', function () {
                            video.play();
                        });
                    }
                })
                .catch(err => console.error("Error fetching camera:", err));
        }

        function closeCamera() {
            document.getElementById('video-modal').style.display = 'none';
            var video = document.getElementById('video-player');
            video.pause();
            video.src = "";
        }

        // Escapes HTML-special characters to prevent XSS via interpolated values.
        function escapeHtml(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }

        // --- B. The Map Updates ---
        socket.on('update_map', function (data) {
            var busId = data.bus_id;
            var lat = data.lat;
            var lng = data.lng;
            var speed = data.speed;

            var listHtml = `<b>الباص ${escapeHtml(busId)}</b><br>السرعة: ${escapeHtml(speed)} كم/س`;
            document.getElementById('bus-list').innerHTML = listHtml;

            var popupContent = `
                <b>الباص ${escapeHtml(busId)}</b><br>
                السرعة: ${escapeHtml(speed)} كم/س<br><br>
                <button class="watch-btn" onclick="openCamera('${escapeHtml(busId)}')">🎥 مشاهدة مباشرة</button>
            `;

            if (busMarkers[busId]) {
                busMarkers[busId].setLatLng([lat, lng])
                    .bindPopup(popupContent);
            } else {
                busMarkers[busId] = L.marker([lat, lng])
                    .addTo(map)
                    .bindPopup(popupContent);
            }
        });
    </script>
</body>

</html>
