<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <title>آمن مدرستي - Safe School Transport</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Tajawal', sans-serif;
            min-height: 100vh;
            background: linear-gradient(160deg, #1a1a2e 0%, #16213e 60%, #0f3460 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }

        /* ── Brand ── */
        .brand {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-icon {
            font-size: 3.2em;
            margin-bottom: 10px;
            display: block;
        }

        .brand h1 {
            color: #ffffff;
            font-size: 1.7em;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .brand p {
            color: #7f8c8d;
            font-size: 0.9em;
            letter-spacing: 0.5px;
        }

        /* ── Card ── */
        .card {
            background: #ffffff;
            border-radius: 20px;
            padding: 36px 32px 28px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .card-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .card-header h2 {
            font-size: 1.25em;
            color: #1a1a2e;
            margin-bottom: 4px;
        }

        .card-header p {
            font-size: 0.85em;
            color: #7f8c8d;
        }

        /* ── Form ── */
        .field {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.82em;
            color: #5d6d7e;
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 13px 16px;
            border: 2px solid #e0e4e8;
            border-radius: 12px;
            font-size: 1em;
            font-family: 'Tajawal', sans-serif;
            color: #1a1a2e;
            background: #f8f9fa;
            transition: border-color 0.25s;
            text-align: right;
        }

        input:focus {
            outline: none;
            border-color: #2980b9;
            background: #ffffff;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: #1a1a2e;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 1.05em;
            font-weight: 700;
            font-family: 'Tajawal', sans-serif;
            cursor: pointer;
            margin-top: 6px;
            transition: background 0.25s, transform 0.15s;
        }

        .login-btn:hover {
            background: #2c3e6e;
            transform: translateY(-1px);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        /* ── Error message ── */
        .error-msg {
            background: #fdecea;
            color: #c0392b;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 0.88em;
            margin-bottom: 16px;
            text-align: center;
        }

        /* ── Divider + portal links ── */
        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 22px 0 18px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e0e4e8;
        }

        .divider span {
            font-size: 0.78em;
            color: #aab8c2;
            white-space: nowrap;
        }

        .portal-links {
            display: flex;
            gap: 10px;
        }

        .portal-btn {
            flex: 1;
            text-align: center;
            padding: 9px 10px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 0.82em;
            font-family: 'Tajawal', sans-serif;
            font-weight: 600;
            transition: all 0.2s;
        }

        .portal-driver {
            background: #f0f2f5;
            color: #2c3e50;
            border: 1px solid #d5dbdb;
        }

        .portal-admin {
            background: #f0f2f5;
            color: #2c3e50;
            border: 1px solid #d5dbdb;
        }

        .portal-btn:hover {
            background: #e0e4e8;
            transform: translateY(-1px);
        }

        /* ── Lang toggle ── */
        .lang-row {
            text-align: center;
            margin-top: 20px;
        }

        .lang-toggle {
            background: none;
            border: 1px solid rgba(255,255,255,0.2);
            color: #aab8c2;
            padding: 5px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Tajawal', sans-serif;
            font-size: 0.82em;
            transition: all 0.2s;
        }

        .lang-toggle:hover {
            border-color: rgba(255,255,255,0.4);
            color: #fff;
        }
    </style>
</head>

<body>

    <div class="brand">
        <span class="brand-icon">🚌</span>
        <h1 id="brand-title">آمن مدرستي</h1>
        <p id="brand-sub">Safe School Transport</p>
    </div>

    <div class="card">
        <div class="card-header">
            <h2 id="card-title">بوابة أولياء الأمور</h2>
            <p id="card-sub">تابع رحلة أطفالك بأمان</p>
        </div>

        {% with messages = get_flashed_messages() %}
        {% if messages %}
        <div class="error-msg">{{ messages[0] }}</div>
        {% endif %}
        {% endwith %}

        <form method="POST" action="/parent/login">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="field">
                <label id="lbl-user">اسم المستخدم</label>
                <input type="text" name="username" id="inp-user"
                       placeholder="أدخل اسم المستخدم" required autocomplete="username">
            </div>

            <div class="field">
                <label id="lbl-pass">كلمة المرور</label>
                <input type="password" name="password" id="inp-pass"
                       placeholder="أدخل كلمة المرور" required autocomplete="current-password">
            </div>

            <button type="submit" class="login-btn" id="btn-login">دخول</button>
        </form>

        <div class="divider">
            <span id="div-text">بوابات أخرى</span>
        </div>

        <div class="portal-links">
            <a href="/driver/login" class="portal-btn portal-driver" id="link-driver">
                🚌 بوابة السائق
            </a>
            <a href="/login" class="portal-btn portal-admin" id="link-admin">
                ⚙️ الإدارة
            </a>
        </div>
    </div>

    <div class="lang-row">
        <button class="lang-toggle" onclick="toggleLang()" id="lang-btn">English</button>
    </div>

    <script>
        const L10N = {
            ar: {
                dir: 'rtl', lang: 'ar',
                brandTitle: 'آمن مدرستي',
                brandSub: 'Safe School Transport',
                cardTitle: 'بوابة أولياء الأمور',
                cardSub: 'تابع رحلة أطفالك بأمان',
                lblUser: 'اسم المستخدم',
                lblPass: 'كلمة المرور',
                phUser: 'أدخل اسم المستخدم',
                phPass: 'أدخل كلمة المرور',
                btnLogin: 'دخول',
                divText: 'بوابات أخرى',
                linkDriver: '🚌 بوابة السائق',
                linkAdmin: '⚙️ الإدارة',
                langBtn: 'English',
            },
            en: {
                dir: 'ltr', lang: 'en',
                brandTitle: 'Amen Madrasati',
                brandSub: 'Safe School Transport',
                cardTitle: 'Parent Portal',
                cardSub: 'Track your child\'s journey safely',
                lblUser: 'Username',
                lblPass: 'Password',
                phUser: 'Enter username',
                phPass: 'Enter password',
                btnLogin: 'Login',
                divText: 'Other portals',
                linkDriver: '🚌 Driver Portal',
                linkAdmin: '⚙️ Admin',
                langBtn: 'عربي',
            }
        };

        let _lang = localStorage.getItem('main_lang') || 'ar';

        function applyLang() {
            const t = L10N[_lang];
            document.documentElement.dir  = t.dir;
            document.documentElement.lang = t.lang;
            document.getElementById('brand-title').textContent  = t.brandTitle;
            document.getElementById('brand-sub').textContent    = t.brandSub;
            document.getElementById('card-title').textContent   = t.cardTitle;
            document.getElementById('card-sub').textContent     = t.cardSub;
            document.getElementById('lbl-user').textContent     = t.lblUser;
            document.getElementById('lbl-pass').textContent     = t.lblPass;
            document.getElementById('inp-user').placeholder     = t.phUser;
            document.getElementById('inp-pass').placeholder     = t.phPass;
            document.getElementById('btn-login').textContent    = t.btnLogin;
            document.getElementById('div-text').textContent     = t.divText;
            document.getElementById('link-driver').textContent  = t.linkDriver;
            document.getElementById('link-admin').textContent   = t.linkAdmin;
            document.getElementById('lang-btn').textContent     = t.langBtn;
            // inputs align with reading direction
            ['inp-user','inp-pass'].forEach(id => {
                document.getElementById(id).style.textAlign = _lang === 'ar' ? 'right' : 'left';
            });
        }

        function toggleLang() {
            _lang = _lang === 'ar' ? 'en' : 'ar';
            localStorage.setItem('main_lang', _lang);
            applyLang();
        }

        applyLang();
    </script>

</body>
</html>
