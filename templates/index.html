<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <title>مسارات - بوابة أولياء الأمور</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Tajawal', sans-serif;
            min-height: 100vh;
            background: #FBF5EC;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }

        /* ── Brand / Logo ── */
        .brand {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-logo {
            display: inline-block;
            margin-bottom: 0;
        }

        /* ── Card ── */
        .card {
            background: #FFFFFF;
            border-radius: 20px;
            padding: 36px 32px 28px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 12px 32px rgba(58, 36, 24, 0.12);
        }

        .card-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .card-header h2 {
            font-size: 1.3em;
            font-weight: 700;
            color: #3A2418;
            margin-bottom: 6px;
        }

        .card-header p {
            font-size: 0.88em;
            color: #8C6A50;
            font-weight: 400;
        }

        /* ── Form ── */
        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 0.82em;
            font-weight: 500;
            color: #5C3D2A;
            margin-bottom: 7px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 13px 16px;
            border: 1.5px solid #E8D8C4;
            border-radius: 10px;
            font-size: 1em;
            font-family: 'Tajawal', sans-serif;
            color: #3A2418;
            background: #FDFAF6;
            transition: border-color 0.25s, box-shadow 0.25s;
            text-align: right;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #D26B3C;
            background: #FFFFFF;
            box-shadow: 0 0 0 4px rgba(210, 107, 60, 0.18);
        }

        input::placeholder {
            color: #B89A82;
        }

        .login-btn {
            width: 100%;
            height: 56px;
            background: #D26B3C;
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-size: 1.05em;
            font-weight: 700;
            font-family: 'Tajawal', sans-serif;
            cursor: pointer;
            margin-top: 6px;
            transition: background 0.25s, transform 0.15s, box-shadow 0.25s;
            letter-spacing: 0.3px;
        }

        .login-btn:hover {
            background: #B85A2E;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(210, 107, 60, 0.30);
        }

        .login-btn:active {
            transform: translateY(0);
            box-shadow: none;
        }

        /* ── Error message ── */
        .error-msg {
            background: #FEF0EB;
            color: #B84422;
            border: 1px solid #F5C4B0;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 0.88em;
            margin-bottom: 18px;
            text-align: center;
        }

        /* ── Divider + portal links ── */
        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 24px 0 16px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #EFE3D0;
        }

        .divider span {
            font-size: 0.78em;
            font-weight: 500;
            color: #B89A82;
            white-space: nowrap;
        }

        .portal-links {
            display: flex;
            gap: 10px;
        }

        .portal-btn {
            flex: 1;
            text-align: center;
            padding: 10px 10px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 0.82em;
            font-family: 'Tajawal', sans-serif;
            font-weight: 600;
            color: #5C3D2A;
            background: #FBF5EC;
            border: 1.5px solid #E8D8C4;
            transition: all 0.2s;
        }

        .portal-btn:hover {
            background: #F5E8D5;
            border-color: #D26B3C;
            color: #D26B3C;
            transform: translateY(-1px);
        }

        /* ── Lang toggle ── */
        .lang-row {
            text-align: center;
            margin-top: 24px;
        }

        .lang-toggle {
            background: none;
            border: 1.5px solid rgba(58, 36, 24, 0.20);
            color: #8C6A50;
            padding: 6px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Tajawal', sans-serif;
            font-size: 0.82em;
            font-weight: 500;
            transition: all 0.2s;
        }

        .lang-toggle:hover {
            border-color: #D26B3C;
            color: #D26B3C;
            background: rgba(210, 107, 60, 0.06);
        }
    </style>
</head>

<body>

    <div class="brand">
        <div class="brand-logo">
            <svg width="240" height="64" viewBox="0 0 240 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="مسارات">
                <!-- Bus mark (clay) -->
                <rect x="4" y="18" width="48" height="30" rx="7" fill="#D26B3C"/>
                <rect x="8" y="24" width="16" height="11" rx="3" fill="#FBF5EC" opacity="0.9"/>
                <rect x="28" y="24" width="16" height="11" rx="3" fill="#FBF5EC" opacity="0.9"/>
                <rect x="4" y="36" width="48" height="6" rx="2" fill="#B85A2E"/>
                <circle cx="16" cy="50" r="5" fill="#3A2418"/>
                <circle cx="16" cy="50" r="2.5" fill="#E8A33B"/>
                <circle cx="40" cy="50" r="5" fill="#3A2418"/>
                <circle cx="40" cy="50" r="2.5" fill="#E8A33B"/>
                <rect x="44" y="22" width="8" height="6" rx="2" fill="#E8A33B"/>
                <!-- "msarat" wordmark -->
                <text x="66" y="38" font-family="Tajawal, sans-serif" font-weight="800" font-size="22" fill="#3A2418" letter-spacing="-0.5">msarat</text>
                <!-- Arabic subtitle -->
                <text x="66" y="54" font-family="Tajawal, sans-serif" font-weight="500" font-size="13" fill="#8C6A50">مسارات</text>
            </svg>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <h2 id="card-title">بوابة أولياء الأمور</h2>
            <p id="card-sub">تابع رحلة أطفالك بأمان</p>
        </div>

        {% with messages = get_flashed_messages() %}
        {% if messages %}
        <div class="error-msg">{{ messages[0] }}</div>
        {% endif %}
        {% endwith %}

        <form method="POST" action="/parent/login">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="field">
                <label id="lbl-user">اسم المستخدم</label>
                <input type="text" name="username" id="inp-user"
                       placeholder="أدخل اسم المستخدم" required autocomplete="username">
            </div>

            <div class="field">
                <label id="lbl-pass">كلمة المرور</label>
                <input type="password" name="password" id="inp-pass"
                       placeholder="أدخل كلمة المرور" required autocomplete="current-password">
            </div>

            <button type="submit" class="login-btn" id="btn-login">دخول</button>
        </form>

        <div class="divider">
            <span id="div-text">بوابات أخرى</span>
        </div>

        <div class="portal-links">
            <a href="/driver/login" class="portal-btn" id="link-driver">
                بوابة السائق
            </a>
            <a href="/login" class="portal-btn" id="link-admin">
                الإدارة
            </a>
        </div>
    </div>

    <div class="lang-row">
        <button class="lang-toggle" onclick="toggleLang()" id="lang-btn">English</button>
    </div>

    <script>
        const L10N = {
            ar: {
                dir: 'rtl', lang: 'ar',
                cardTitle: 'بوابة أولياء الأمور',
                cardSub: 'تابع رحلة أطفالك بأمان',
                lblUser: 'اسم المستخدم',
                lblPass: 'كلمة المرور',
                phUser: 'أدخل اسم المستخدم',
                phPass: 'أدخل كلمة المرور',
                btnLogin: 'دخول',
                divText: 'بوابات أخرى',
                linkDriver: 'بوابة السائق',
                linkAdmin: 'الإدارة',
                langBtn: 'English',
            },
            en: {
                dir: 'ltr', lang: 'en',
                cardTitle: 'Parent Portal',
                cardSub: 'Track your child\'s journey safely',
                lblUser: 'Username',
                lblPass: 'Password',
                phUser: 'Enter username',
                phPass: 'Enter password',
                btnLogin: 'Login',
                divText: 'Other portals',
                linkDriver: 'Driver Portal',
                linkAdmin: 'Admin',
                langBtn: 'عربي',
            }
        };

        let _lang = localStorage.getItem('main_lang') || 'ar';

        function applyLang() {
            const t = L10N[_lang];
            document.documentElement.dir  = t.dir;
            document.documentElement.lang = t.lang;
            document.getElementById('card-title').textContent   = t.cardTitle;
            document.getElementById('card-sub').textContent     = t.cardSub;
            document.getElementById('lbl-user').textContent     = t.lblUser;
            document.getElementById('lbl-pass').textContent     = t.lblPass;
            document.getElementById('inp-user').placeholder     = t.phUser;
            document.getElementById('inp-pass').placeholder     = t.phPass;
            document.getElementById('btn-login').textContent    = t.btnLogin;
            document.getElementById('div-text').textContent     = t.divText;
            document.getElementById('link-driver').textContent  = t.linkDriver;
            document.getElementById('link-admin').textContent   = t.linkAdmin;
            document.getElementById('lang-btn').textContent     = t.langBtn;
            // inputs align with reading direction
            ['inp-user','inp-pass'].forEach(id => {
                document.getElementById(id).style.textAlign = _lang === 'ar' ? 'right' : 'left';
            });
        }

        function toggleLang() {
            _lang = _lang === 'ar' ? 'en' : 'ar';
            localStorage.setItem('main_lang', _lang);
            applyLang();
        }

        applyLang();
    </script>

</body>
</html>
