<!DOCTYPE html>
<html>

<head>
    <title>Login - School Bus System</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #eee;
        }

        .login-box {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        h2 {
            text-align: center;
            margin-top: 0;
        }
    </style>
</head>

<body>
    <div class="login-box">
        <h2>🔐 Staff Login</h2>
        <form method="POST" action="/login">
            <input type="text" name="username" placeholder="Username (e.g. The Boss)" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Sign In</button>
        </form>
        <p style="font-size:0.8em; color:#666; text-align:center; margin-top:20px;">
            Default Super Admin:<br>
            User: <b>The Boss</b> / Pass: <b>admin123</b>
        </p>
    </div>
</body>

</html>
