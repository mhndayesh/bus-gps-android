<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <title>آمن مدرستي - لوحة ولي الأمر</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --sage-green: #9FB8AD;
            --sage-dark: #7A9A8D;
            --gold: #F5C518;
            --gold-dark: #D4A914;
            --black: #1A1A1A;
            --cream: #F5F5F0;
            --white: #FFFFFF;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            margin: 0;
            background: var(--sage-green);
        }

        /* Mobile Header */
        .header {
            background: var(--black);
            color: var(--cream);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h3 {
            margin: 0;
            color: var(--gold);
            font-size: 1.2em;
        }

        .header .subtitle {
            font-size: 0.8em;
            color: var(--sage-green);
        }

        .header a {
            color: var(--cream);
            text-decoration: none;
            background: #c0392b;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 0.85em;
        }

        /* Child Cards */
        .card-container {
            padding: 15px;
            display: flex;
            gap: 15px;
            overflow-x: auto;
        }

        .child-card {
            background: var(--cream);
            padding: 20px;
            border-radius: 15px;
            min-width: 240px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            border-right: 5px solid var(--sage-dark);
        }

        .child-card h3 {
            margin: 0 0 10px 0;
            color: var(--black);
        }

        .status-on {
            border-right-color: var(--gold);
            background: linear-gradient(135deg, var(--cream) 0%, rgba(245, 197, 24, 0.1) 100%);
        }

        .status-off {
            border-right-color: var(--sage-dark);
        }

        .status-badge {
            display: inline-block;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
        }

        .status-badge.on {
            background: var(--gold);
            color: var(--black);
        }

        .status-badge.off {
            background: var(--sage-dark);
            color: var(--white);
        }

        /* The Map */
        #map {
            height: 60vh;
            width: 100%;
            border-top: 3px solid var(--gold);
        }

        /* Video Overlay */
        #video-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(26, 26, 26, 0.95);
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #live-stream-img {
            width: 90%;
            max-width: 800px;
            border-radius: 12px;
            border: 3px solid var(--gold);
            background: #000;
        }

        video {
            width: 90%;
            max-width: 800px;
            border-radius: 12px;
            border: 3px solid var(--gold);
        }

        .btn-close {
            padding: 15px 40px;
            background: var(--gold);
            color: var(--black);
            border: none;
            font-size: 16px;
            font-weight: bold;
            margin-top: 15px;
            border-radius: 25px;
            cursor: pointer;
            font-family: 'Tajawal', sans-serif;
        }

        .btn-close:hover {
            background: var(--gold-dark);
        }

        .btn-watch {
            display: inline-block;
            margin-top: 12px;
            padding: 10px 18px;
            background: var(--gold);
            color: var(--black);
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9em;
            font-family: 'Tajawal', sans-serif;
        }

        .btn-watch:hover {
            background: var(--gold-dark);
        }

        .no-children {
            text-align: center;
            padding: 30px;
            color: var(--black);
        }

        /* Live Stream Status */
        .stream-status {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(231, 76, 60, 0.9);
            color: white;
            padding: 8px 20px;
            border-radius: 25px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stream-status .live-dot {
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
            animation: blink 1s infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }

        .waiting-stream {
            color: var(--cream);
            text-align: center;
            padding: 50px;
        }

        .waiting-stream p {
            margin: 10px 0;
        }
    </style>
</head>

<body>

    <div class="header">
        <div>
            <h3>🚸 أطفالي</h3>
            <span class="subtitle">مرحباً {{ user }}</span>
        </div>
        <a href="/logout">خروج</a>
    </div>

    <div class="card-container" id="kids-list">
        <div style="padding:20px; color: var(--black);">جاري تحميل البيانات...</div>
    </div>

    <div id="map"></div>

    <div id="video-modal">
        <div class="stream-status" id="stream-status" style="display:none;">
            <span class="live-dot"></span>
            <span>بث مباشر - LIVE</span>
        </div>

        <!-- Live Stream Image (for WebSocket frames) -->
        <img id="live-stream-img" style="display:none;" alt="Live Stream">

        <!-- HLS Video Player (fallback for IP cameras) -->
        <video id="video-player" style="display:none;" controls autoplay></video>

        <!-- Waiting Message -->
        <div id="waiting-msg" class="waiting-stream" style="display:none;">
            <h2>⏳ في انتظار البث...</h2>
            <p>Waiting for driver to start streaming</p>
            <p style="color:var(--sage-green); font-size:0.9em;">سيبدأ البث تلقائياً عندما يشغله السائق</p>
        </div>

        <button class="btn-close" onclick="closeCam()">✕ إغلاق الكاميرا</button>
    </div>

    <script>
        var map = L.map('map').setView([21.5433, 39.1728], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        var socket = io();
        var trackedBusIds = [];
        var busMarkers = {};
        var currentStreamBusId = null;

        // --- Load Children Data on Page Load ---
        function loadMyChildren() {
            fetch('/api/get_my_kids')
                .then(res => res.json())
                .then(children => {
                    var html = "";
                    trackedBusIds = [];

                    if (children.length === 0) {
                        html = '<div class="no-children"><p>لم يتم تسجيل أطفال بعد</p><p style="color:var(--sage-dark);">No children registered yet</p></div>';
                    }

                    children.forEach(child => {
                        var statusClass = child.on_bus ? "status-on" : "status-off";
                        var badgeClass = child.on_bus ? "on" : "off";
                        var statusTextAr = child.on_bus ? `🚌 في الحافلة` : "🏫 في المدرسة / المنزل";
                        var statusTextEn = child.on_bus ? `On Bus` : "At School / Home";
                        var watchBtn = child.on_bus && child.bus_id ?
                            `<button class="btn-watch" onclick="openCam('${child.bus_id}')">🎥 مشاهدة مباشرة</button>` : '';

                        html += `
                    <div class="child-card ${statusClass}">
                        <h3>${child.name}</h3>
                        <span class="status-badge ${badgeClass}">${statusTextAr}</span>
                        <div style="font-size:0.8em; color:var(--sage-dark); margin-top:5px;">${statusTextEn}</div>
                        ${watchBtn}
                    </div>`;

                        if (child.on_bus && child.bus_id) trackedBusIds.push(child.bus_id.toString());
                    });

                    document.getElementById('kids-list').innerHTML = html;
                })
                .catch(err => {
                    document.getElementById('kids-list').innerHTML = '<div class="no-children"><p style="color:#c0392b;">خطأ في تحميل البيانات</p></div>';
                    console.error(err);
                });
        }

        loadMyChildren();

        // --- Real-Time Map (Filtered) ---
        socket.on('update_map', function (data) {
            if (trackedBusIds.includes(data.bus_id.toString())) {
                var markerPos = [data.lat, data.lng];

                if (busMarkers[data.bus_id]) {
                    busMarkers[data.bus_id].setLatLng(markerPos);
                } else {
                    var icon = L.divIcon({ className: 'bus-icon', html: '🚌', iconSize: [30, 30] });
                    busMarkers[data.bus_id] = L.marker(markerPos, { icon: icon })
                        .addTo(map)
                        .bindPopup(`الباص ${data.bus_id}`);

                    map.setView(markerPos, 15);
                }
            }
        });

        // --- Live Attendance Updates ---
        socket.on('student_status_update', function (data) {
            console.log("🔔 Student Update:", data);
            loadMyChildren();
        });

        // --- CAMERA STREAMING LOGIC ---

        // Handle incoming camera frames
        socket.on('bus_camera_frame', function (data) {
            if (currentStreamBusId && data.bus_id === currentStreamBusId) {
                const img = document.getElementById('live-stream-img');
                img.src = data.frame;
                img.style.display = 'block';

                // Show live indicator
                document.getElementById('stream-status').style.display = 'flex';
                document.getElementById('waiting-msg').style.display = 'none';
                document.getElementById('video-player').style.display = 'none';
            }
        });

        // Handle stream status updates
        socket.on('bus_stream_status', function (data) {
            if (currentStreamBusId && data.bus_id === currentStreamBusId) {
                if (data.streaming) {
                    document.getElementById('stream-status').style.display = 'flex';
                    document.getElementById('waiting-msg').style.display = 'none';
                } else {
                    document.getElementById('stream-status').style.display = 'none';
                    document.getElementById('waiting-msg').style.display = 'block';
                    document.getElementById('live-stream-img').style.display = 'none';
                }
            }
        });

        function openCam(busId) {
            currentStreamBusId = busId;
            document.getElementById('video-modal').style.display = 'flex';

            // Show waiting message initially
            document.getElementById('waiting-msg').style.display = 'block';
            document.getElementById('live-stream-img').style.display = 'none';
            document.getElementById('video-player').style.display = 'none';
            document.getElementById('stream-status').style.display = 'none';

            // Join the bus stream
            socket.emit('join_bus_stream', { bus_id: busId });

            // Also try to fetch HLS stream as fallback (for IP cameras)
            fetch(`/get_camera/${busId}`)
                .then(res => res.json())
                .then(data => {
                    if (data.stream_url && data.stream_url !== 'none') {
                        // Use HLS stream if available
                        var video = document.getElementById('video-player');
                        if (Hls.isSupported()) {
                            var hls = new Hls();
                            hls.loadSource(data.stream_url);
                            hls.attachMedia(video);
                            video.style.display = 'block';
                            document.getElementById('waiting-msg').style.display = 'none';
                        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                            video.src = data.stream_url;
                            video.style.display = 'block';
                            document.getElementById('waiting-msg').style.display = 'none';
                        }
                    }
                })
                .catch(err => {
                    console.log('No HLS stream, waiting for live frames');
                });
        }

        function closeCam() {
            currentStreamBusId = null;
            document.getElementById('video-modal').style.display = 'none';
            document.getElementById('video-player').pause();
            document.getElementById('live-stream-img').src = '';
        }

        // Poll for updates every 10 seconds
        setInterval(() => {
            loadMyChildren();
        }, 10000);

    </script>
</body>

</html>
