<!DOCTYPE html>
<html>

<head>
    <title>Parent Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            background: #f0f2f5;
        }

        /* Mobile Header */
        .header {
            background: #2c3e50;
            color: white;
            padding: 15px;
            text-align: center;
        }

        /* Child Cards */
        .card-container {
            padding: 10px;
            display: flex;
            gap: 10px;
            overflow-x: auto;
        }

        .child-card {
            background: white;
            padding: 15px;
            border-radius: 12px;
            min-width: 200px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            border-left: 5px solid #ddd;
        }

        .status-on {
            border-left-color: #27ae60;
        }

        /* Green for On Bus */
        .status-off {
            border-left-color: #95a5a6;
        }

        /* Grey for Off */

        /* The Map */
        #map {
            height: 60vh;
            width: 100%;
            border-top: 1px solid #ccc;
        }

        /* Video Overlay */
        #video-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
        }

        video {
            width: 100%;
        }

        .btn-close {
            padding: 15px;
            background: red;
            color: white;
            border: none;
            font-size: 16px;
            width: 100%;
        }
    </style>
</head>

<body>

    <div class="header">
        <h3 style="margin:0;">🚸 My Kids - Welcome {{ user }}</h3>
        <a href="/logout" style="color:white; font-size:12px;">Logout</a>
    </div>

    <div class="card-container" id="kids-list">
        <div style="padding:20px;">Loading children...</div>
    </div>

    <div id="map"></div>

    <div id="video-modal">
        <video id="video-player" controls autoplay></video>
        <button class="btn-close" onclick="closeCam()">CLOSE CAMERA</button>
    </div>

    <script>
        var map = L.map('map').setView([21.5433, 39.1728], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        var socket = io();
        var trackedBusIds = []; // List of buses my kids are on
        var busMarkers = {};

        // --- Load Children Data on Page Load ---
        function loadMyChildren() {
            fetch('/api/get_my_kids')
                .then(res => res.json())
                .then(children => {
                    var html = "";
                    trackedBusIds = []; // Reset tracking list

                    if (children.length === 0) {
                        html = '<p style="padding:20px;">No children registered yet.</p>';
                    }

                    children.forEach(child => {
                        var statusClass = child.on_bus ? "status-on" : "status-off";
                        var statusText = child.on_bus ? `🚌 ON BUS` : "🏫 AT SCHOOL / HOME";

                        html += `
                    <div class="child-card ${statusClass}">
                        <h3>${child.name}</h3>
                        <div>${statusText}</div>
                    </div>`;

                        if (child.on_bus && child.bus_id) trackedBusIds.push(child.bus_id.toString());
                    });

                    document.getElementById('kids-list').innerHTML = html;
                })
                .catch(err => {
                    document.getElementById('kids-list').innerHTML = '<p style="color:red;">Error loading data</p>';
                    console.error(err);
                });
        }

        // Load on startup
        loadMyChildren();

        // --- C. Real-Time Map (Filtered) ---
        // --- C. Real-Time Map (Filtered) ---
        socket.on('update_map', function (data) {
            // SECURITY FILTER: Only show bus if my child is on it
            if (trackedBusIds.includes(data.bus_id.toString())) {

                var markerPos = [data.lat, data.lng];

                if (busMarkers[data.bus_id]) {
                    busMarkers[data.bus_id].setLatLng(markerPos);
                } else {
                    var icon = L.divIcon({ className: 'bus-icon', html: '🚌', iconSize: [30, 30] });
                    busMarkers[data.bus_id] = L.marker(markerPos, { icon: icon })
                        .addTo(map)
                        .bindPopup(`Bus ${data.bus_id}`);

                    // Auto-zoom to the bus
                    map.setView(markerPos, 15);
                }
            }
        });

        // --- NEW: Live Attendance Updates ---
        socket.on('student_status_update', function (data) {
            // data = { student_id, status, bus_id }
            console.log("🔔 Student Update:", data);

            // Reload children to refresh status text and "Watch Live" button
            // This is safer than DOM manipulation because it handles all state logic (bus_id, plate, etc)
            loadMyChildren();
        });

        // --- D. Camera Logic ---
        function openCam(busId) {
            fetch(`/get_camera/${busId}`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('video-modal').style.display = 'flex';
                    var video = document.getElementById('video-player');
                    if (Hls.isSupported()) {
                        var hls = new Hls();
                        hls.loadSource(data.stream_url);
                        hls.attachMedia(video);
                    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                        video.src = data.stream_url;
                    }
                });
        }

        function closeCam() {
            document.getElementById('video-modal').style.display = 'none';
            document.getElementById('video-player').pause();
        }

        // Poll for child status updates every 10 seconds (e.g., did they get off?)
        setInterval(() => {
            if (myParentId) loadMyChildren();
        }, 10000);

    </script>
</body>

</html>
