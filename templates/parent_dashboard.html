<!DOCTYPE html>
<html>

<head>
    <title>آمن مدرستي - Parent Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --sage-green: #9FB8AD;
            --sage-dark: #7A9A8D;
            --gold: #F5C518;
            --gold-dark: #D4A914;
            --black: #1A1A1A;
            --cream: #F5F5F0;
            --white: #FFFFFF;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            margin: 0;
            background: var(--sage-green);
        }

        /* Mobile Header */
        .header {
            background: var(--black);
            color: var(--cream);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h3 {
            margin: 0;
            color: var(--gold);
        }

        .header a {
            color: var(--cream);
            text-decoration: none;
            background: #c0392b;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 0.85em;
        }

        /* Child Cards */
        .card-container {
            padding: 15px;
            display: flex;
            gap: 15px;
            overflow-x: auto;
        }

        .child-card {
            background: var(--cream);
            padding: 20px;
            border-radius: 15px;
            min-width: 220px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            border-left: 5px solid var(--sage-dark);
        }

        .child-card h3 {
            margin: 0 0 10px 0;
            color: var(--black);
        }

        .status-on {
            border-left-color: var(--gold);
            background: linear-gradient(135deg, var(--cream) 0%, rgba(245, 197, 24, 0.1) 100%);
        }

        .status-off {
            border-left-color: var(--sage-dark);
        }

        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
        }

        .status-badge.on {
            background: var(--gold);
            color: var(--black);
        }

        .status-badge.off {
            background: var(--sage-dark);
            color: var(--white);
        }

        /* The Map */
        #map {
            height: 60vh;
            width: 100%;
            border-top: 3px solid var(--gold);
        }

        /* Video Overlay */
        #video-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(26, 26, 26, 0.95);
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        video {
            width: 90%;
            max-width: 800px;
            border-radius: 12px;
            border: 3px solid var(--gold);
        }

        .btn-close {
            padding: 15px 40px;
            background: var(--gold);
            color: var(--black);
            border: none;
            font-size: 16px;
            font-weight: bold;
            margin-top: 15px;
            border-radius: 25px;
            cursor: pointer;
            font-family: 'Tajawal', sans-serif;
        }

        .btn-close:hover {
            background: var(--gold-dark);
        }

        .btn-watch {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 15px;
            background: var(--gold);
            color: var(--black);
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85em;
        }

        .btn-watch:hover {
            background: var(--gold-dark);
        }
    </style>
</head>

<body>

    <div class="header">
        <h3>🚸 آمن مدرستي - Welcome {{ user }}</h3>
        <a href="/logout">Logout</a>
    </div>

    <div class="card-container" id="kids-list">
        <div style="padding:20px; color: var(--black);">Loading children...</div>
    </div>

    <div id="map"></div>

    <div id="video-modal">
        <video id="video-player" controls autoplay></video>
        <button class="btn-close" onclick="closeCam()">✕ CLOSE CAMERA</button>
    </div>

    <script>
        var map = L.map('map').setView([21.5433, 39.1728], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        var socket = io();
        var trackedBusIds = []; // List of buses my kids are on
        var busMarkers = {};

        // --- Load Children Data on Page Load ---
        function loadMyChildren() {
            fetch('/api/get_my_kids')
                .then(res => res.json())
                .then(children => {
                    var html = "";
                    trackedBusIds = []; // Reset tracking list

                    if (children.length === 0) {
                        html = '<div class="child-card"><p>No children registered yet.</p></div>';
                    }

                    children.forEach(child => {
                        var statusClass = child.on_bus ? "status-on" : "status-off";
                        var badgeClass = child.on_bus ? "on" : "off";
                        var statusText = child.on_bus ? `🚌 ON BUS` : "🏫 AT SCHOOL / HOME";
                        var watchBtn = child.on_bus && child.bus_id ?
                            `<button class="btn-watch" onclick="openCam('${child.bus_id}')">🎥 Watch Live</button>` : '';

                        html += `
                    <div class="child-card ${statusClass}">
                        <h3>${child.name}</h3>
                        <span class="status-badge ${badgeClass}">${statusText}</span>
                        ${watchBtn}
                    </div>`;

                        if (child.on_bus && child.bus_id) trackedBusIds.push(child.bus_id.toString());
                    });

                    document.getElementById('kids-list').innerHTML = html;
                })
                .catch(err => {
                    document.getElementById('kids-list').innerHTML = '<div class="child-card"><p style="color:#c0392b;">Error loading data</p></div>';
                    console.error(err);
                });
        }

        // Load on startup
        loadMyChildren();

        // --- C. Real-Time Map (Filtered) ---
        socket.on('update_map', function (data) {
            // SECURITY FILTER: Only show bus if my child is on it
            if (trackedBusIds.includes(data.bus_id.toString())) {

                var markerPos = [data.lat, data.lng];

                if (busMarkers[data.bus_id]) {
                    busMarkers[data.bus_id].setLatLng(markerPos);
                } else {
                    var icon = L.divIcon({ className: 'bus-icon', html: '🚌', iconSize: [30, 30] });
                    busMarkers[data.bus_id] = L.marker(markerPos, { icon: icon })
                        .addTo(map)
                        .bindPopup(`Bus ${data.bus_id}`);

                    // Auto-zoom to the bus
                    map.setView(markerPos, 15);
                }
            }
        });

        // --- NEW: Live Attendance Updates ---
        socket.on('student_status_update', function (data) {
            console.log("🔔 Student Update:", data);
            loadMyChildren();
        });

        // --- D. Camera Logic ---
        function openCam(busId) {
            fetch(`/get_camera/${busId}`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('video-modal').style.display = 'flex';
                    var video = document.getElementById('video-player');
                    if (Hls.isSupported()) {
                        var hls = new Hls();
                        hls.loadSource(data.stream_url);
                        hls.attachMedia(video);
                    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                        video.src = data.stream_url;
                    }
                });
        }

        function closeCam() {
            document.getElementById('video-modal').style.display = 'none';
            document.getElementById('video-player').pause();
        }

        // Poll for child status updates every 10 seconds
        setInterval(() => {
            loadMyChildren();
        }, 10000);

    </script>
</body>

</html>
